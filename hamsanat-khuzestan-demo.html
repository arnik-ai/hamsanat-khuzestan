      ${field('desc', 'شرح مشکل', textArea('desc', 'rows="3" maxlength="500" placeholder="چه اتفاقی افتاده، از کی، و چه اثری بر تولید داشته است؟"'), { cls: 'full' })}
      ${field('priority', 'اولویت', segmented('priority', Object.entries(PRIORITIES).map(([k, p]) => [k, p.label]), 'medium'), { group: true, cls: 'full', hint: 'فوری: تولید متوقف شده است. زیاد: تولید مختل شده است.' })}
      ${field('note', 'توضیحات تکمیلی (اختیاری)', textArea('note', 'rows="2" maxlength="300" placeholder="شماره قطعه، ساعت تماس مناسب یا هر نکته دیگر"'), { cls: 'full' })}
    </form>`,
    footer: `<button class="btn btn-primary" type="submit" form="caseForm">${icon('send')}ثبت پرونده</button><button class="btn btn-ghost" data-action="close">انصراف</button>`
  });
}

FORMS.case = form => {
  const ok = validate(form, {
    cat: required('موضوع را انتخاب کنید.'),
    title: v => (!v ? 'یک عنوان کوتاه بنویسید.' : v.length < 5 ? 'عنوان کوتاه است؛ دست‌کم ۵ حرف بنویسید.' : ''),
    desc: v => (!v ? 'شرح مشکل را بنویسید.' : v.length < 15 ? 'کمی بیشتر توضیح دهید (دست‌کم ۱۵ حرف) تا کارشناس سریع‌تر اقدام کند.' : ''),
    priority: required('اولویت را انتخاب کنید.')
  });
  if (!ok) return;
  const d = Object.fromEntries(new FormData(form));
  const c = createCase({ cat: d.cat, title: d.title.trim(), desc: d.desc.trim(), priority: d.priority, note: (d.note || '').trim() });
  rerender();
  openPanel({
    size: 'sm', key: 'case-ok:' + c.id, title: 'پرونده ثبت شد',
    body: `<div class="success-hero"><span class="ok">${icon('check')}</span><h3>کد پیگیری: ${code(c.id)}</h3>
        <p>وضعیت فعلی «ثبت‌شده» است و به میز خدمت شهرک اطلاع داده شد. هر تغییر وضعیت را در اعلان‌ها و همین بخش می‌بینید.</p></div>
      <div class="sec">${stepper('new')}</div>`,
    footer: `<button class="btn btn-primary" data-action="go" data-page="desk" data-open="${c.id}">مشاهده پرونده</button><button class="btn btn-ghost" data-action="close">بستن</button>`
  });
};

function openCase(id) {
  const c = findCase(id);
  if (!c) return toast('این پرونده پیدا نشد.', 'warn');
  const mine = c.company === ME;
  const answered = c.status === 'answered' && mine;
  openPanel({
    kind: 'drawer', key: 'case:' + id, reopen: () => openCase(id), title: c.title,
    sub: `${code(c.id)}${statusPill(c.status)}${prioPill(c.priority)}`,
    body: `${answered ? `<div class="notice tone-blue">${icon('message')}<span>کارشناس پاسخ داده است. اگر مشکل برطرف شده، پرونده را ببندید؛ در غیر این صورت «هنوز حل نشده» را بزنید تا دوباره بررسی شود.</span></div>` : ''}
      ${caseInfo(c)}
      <div class="sec"><div class="sec-title">${icon('history')}تاریخچه مراحل</div>${historyHTML(c, false)}</div>
      ${mine && c.status !== 'closed' ? `<form class="sec reply" data-form="message" data-id="${c.id}" novalidate>
        ${field('msg', 'ارسال توضیح تکمیلی برای کارشناس', textArea('msg', 'rows="2" maxlength="300" placeholder="مثلاً: امروز صبح هم قطعی داشتیم."'))}
        <button class="btn btn-soft btn-sm" type="submit">${icon('send')}ارسال</button></form>` : ''}
      <div class="notice tone-gray sec">${icon('info')}<span>وضعیت پرونده را کارشناس شهرک تغییر می‌دهد. برای نشان دادن آن، دکمه «${ROLE_LABEL.expert}» را در بالای صفحه بزنید.</span></div>`,
    footer: (answered
      ? `<button class="btn btn-green" data-action="close-case" data-id="${c.id}">${icon('checkCircle')}رفع شد؛ بستن پرونده</button><button class="btn btn-ghost" data-action="reopen-case" data-id="${c.id}">هنوز حل نشده</button>`
      : '') + `<button class="btn btn-ghost" data-action="as-expert" data-id="${c.id}">${icon('userCheck')}مشاهده به‌عنوان کارشناس شهرک</button>`
  });
}

FORMS.message = form => {
  if (!validate(form, { msg: v => (!v ? 'متن پیام را بنویسید.' : '') })) return;
  const c = findCase(form.dataset.id), text = form.elements.msg.value.trim();
  c.history.push({ at: Date.now(), kind: 'message', role: 'company', by: USERS.company.name, text });
  c.updated = Date.now();
  notify('expert', { icon: 'message', tone: 'blue', text: `پیام تازه شرکت در پرونده ${c.id}.`, link: { page: 'expert', open: c.id } });
  save();
  rerender();
  toast('پیام برای کارشناس ارسال شد.');
};
ACTIONS['close-case'] = el => { changeStatus(findCase(el.dataset.id), 'closed', 'مشکل برطرف شد؛ پرونده توسط شرکت بسته شد.', 'company'); rerender(); toast('پرونده بسته شد. از بازخورد شما متشکریم.'); };
ACTIONS['reopen-case'] = el => { changeStatus(findCase(el.dataset.id), 'review', 'شرکت اعلام کرد مشکل هنوز حل نشده است؛ پرونده دوباره در حال بررسی است.', 'company'); rerender(); toast('پرونده دوباره به «در حال بررسی» برگشت.', 'info'); };
ACTIONS['as-expert'] = el => go('expert', el.dataset.id);

/* ---------- Page 5: expert panel ---------- */
PAGES.expert = {
  title: 'پنل کارشناس',
  results() {
    const f = ui.expert, q = norm(f.q);
    const list = state.cases.filter(c =>
      (f.status === 'all' || (f.status === 'open' ? c.status !== 'closed' : c.status === f.status)) &&
      (f.cat === 'all' || c.cat === f.cat) && (f.priority === 'all' || c.priority === f.priority) &&
      (!q || norm(c.id + c.title + companyOf(c).name).includes(q)))
      .sort((a, b) => b.updated - a.updated);
    return `<p class="result-count">${fa(list.length)} درخواست</p>` + (list.length ? caseTable(list, true)
      : `<div class="card">${emptyState('درخواستی با این فیلترها پیدا نشد.', '<button class="btn btn-ghost btn-sm" data-action="ef-clear">پاک کردن فیلترها</button>')}</div>`);
  },
  render() {
    const f = ui.expert, all = state.cases, fu = followUps();
    const open = all.filter(c => c.status !== 'closed').length;
    const weekAnswered = all.filter(c => c.history.some(h => h.status === 'answered' && Date.now() - h.at < 7 * DAY)).length;
    const opt = (list, val) => list.map(([k, l]) => `<option value="${k}" ${val === k ? 'selected' : ''}>${l}</option>`).join('');
    return `<section class="role-banner">
        <span class="avatar lg expert">${USERS.expert.initials}</span>
        <div><h1>پنل کارشناس · ${USERS.expert.name}</h1><p>${USERS.expert.title} · ${USERS.expert.unit}. شما به‌عنوان کارشناس شهرک وارد شده‌اید: درخواست‌های همه شرکت‌ها را می‌بینید، وضعیت را تغییر می‌دهید و یادداشت داخلی ثبت می‌کنید.</p></div>
        <button class="btn btn-ghost btn-sm" data-action="role" data-role="company">${icon('factory')}${ROLE_LABEL.company}</button>
      </section>
      <div class="kpis">
        <div class="kpi card">${iconTile('inbox', 'blue')}<div><b>${fa(open)}</b><span>درخواست باز</span></div></div>
        <div class="kpi card">${iconTile('plusCircle', 'gray')}<div><b>${fa(caseCount(all, 'new'))}</b><span>جدید، بدون اقدام</span></div></div>
        <div class="kpi card">${iconTile('alert', 'red')}<div><b>${fa(fu.length)}</b><span>نیازمند پیگیری</span></div></div>
        <div class="kpi card">${iconTile('message', 'green')}<div><b>${fa(weekAnswered)}</b><span>پاسخ‌داده‌شده در ۷ روز</span></div></div>
      </div>
      <div class="expert-grid">
        <div class="expert-main">
          <div class="toolbar">
            <label class="tsearch">${icon('search')}<input id="expert-q" type="search" placeholder="شرکت، عنوان یا شناسه…" value="${esc(f.q)}" data-filter="expert.q" aria-label="جست‌وجوی درخواست"></label>
            <select id="expert-cat" class="tselect" data-filter="expert.cat" aria-label="نوع درخواست">${opt([['all', 'همه انواع'], ...Object.entries(CASE_CATS).map(([k, v]) => [k, v.label])], f.cat)}</select>
            <select id="expert-priority" class="tselect" data-filter="expert.priority" aria-label="اولویت">${opt([['all', 'همه اولویت‌ها'], ...Object.entries(PRIORITIES).map(([k, v]) => [k, 'اولویت ' + v.label])], f.priority)}</select>
            <select id="expert-status" class="tselect" data-filter="expert.status" aria-label="وضعیت">${opt([['open', 'همه باز'], ['all', 'همه وضعیت‌ها'], ...STATUSES.map(s => [s.key, s.label])], f.status)}</select>
          </div>
          <div id="results">${this.results()}</div>
        </div>
        <aside class="card followups">
          <div class="card-head"><h2>${icon('alert')}نیازمند پیگیری</h2><span class="sub">${fa(fu.length)} پرونده</span></div>
          <ul>${fu.length ? fu.map(({ c, reasons }) => `<li><button class="fu" data-action="open" data-id="${c.id}">
            <span class="fu-top">${code(c.id)}${prioPill(c.priority)}</span>
            <strong>${esc(c.title)}</strong><small>${esc(companyOf(c).name)}</small>
            <span class="fu-reasons">${reasons.map(r => `<span>${icon('clock')}${r}</span>`).join('')}</span></button></li>`).join('')
            : `<li class="muted fu-empty">${icon('checkCircle')}همه پرونده‌ها در زمان مقرر پیگیری شده‌اند.</li>`}</ul>
          <p class="fu-rule">قاعده نمایشی: اولویت فوری، بیش از یک روز بدون اقدام، یا گذشتن از سررسید پاسخ بر اساس اولویت.</p>
        </aside>
      </div>`;
  }
};

ACTIONS['ef-clear'] = () => { Object.assign(ui.expert, { q: '', status: 'open', cat: 'all', priority: 'all' }); rerender(); };

function openExpertCase(id) {
  const c = findCase(id);
  if (!c) return toast('این پرونده پیدا نشد.', 'warn');
  const cur = STATUS[c.status].step, next = cur < 4 ? cur + 1 : -1;
  openPanel({
    kind: 'drawer', key: 'xcase:' + id, reopen: () => openExpertCase(id), title: c.title,
    sub: `${code(c.id)}${statusPill(c.status)}${prioPill(c.priority)}<span>${esc(companyOf(c).name)}</span>`,
    body: `${caseInfo(c)}
      <form class="sec act-box" data-form="status" data-id="${c.id}" novalidate>
        <div class="sec-title">${icon('reset')}تغییر وضعیت</div>
        <div class="status-pick" role="radiogroup" aria-label="وضعیت جدید">${STATUSES.map((s, i) => `<label class="sp-opt ${toneCls(s.tone)}"><input type="radio" name="status" value="${s.key}" ${i === next ? 'checked' : ''} ${s.key === c.status ? 'disabled' : ''}><span>${s.label}${s.key === c.status ? ' (فعلی)' : ''}</span></label>`).join('')}</div>
        ${field('text', 'پیام برای شرکت (اختیاری)', textArea('text', 'rows="2" maxlength="300" placeholder="مثلاً: موضوع به واحد برق ارجاع شد؛ نتیجه تا پایان هفته اعلام می‌شود."'))}
        <button class="btn btn-primary btn-sm" type="submit">${icon('check')}ثبت وضعیت و اطلاع به شرکت</button>
      </form>
      <div class="sec act-row">
        ${field('assignee', 'مسئول پیگیری', selectBox('assignee', UNITS.map(u => [u, u]), c.assignee))}
      </div>
      <form class="sec act-box note-box" data-form="note" data-id="${c.id}" novalidate>
        <div class="sec-title">${icon('lock')}یادداشت داخلی <span class="sec-count">فقط کارشناسان می‌بینند</span></div>
        ${field('note', 'متن یادداشت', textArea('note', 'rows="2" maxlength="300" placeholder="مثلاً: با مسئول پست برق تماس گرفته شد."'))}
        <button class="btn btn-soft btn-sm" type="submit">${icon('note')}ثبت یادداشت</button>
      </form>
      <div class="sec"><div class="sec-title">${icon('history')}تاریخچه و یادداشت‌ها</div>${historyHTML(c, true)}</div>`,
    footer: `<button class="btn btn-ghost" data-action="close">بستن</button>`
  });
}

FORMS.status = form => {
  if (!validate(form, { status: required('وضعیت جدید را انتخاب کنید.') })) return;
  const c = findCase(form.dataset.id), status = form.elements.status.value;
  changeStatus(c, status, form.elements.text.value.trim(), 'expert');
  rerender();
  toast(`وضعیت به «${STATUS[status].label}» تغییر کرد و به شرکت اطلاع داده شد.`);
};
FORMS.note = form => {
  if (!validate(form, { note: v => (!v ? 'متن یادداشت را بنویسید.' : '') })) return;
  const c = findCase(form.dataset.id);
  c.notes.push({ at: Date.now(), by: USERS.expert.name, text: form.elements.note.value.trim() });
  save();
  rerender();
  toast('یادداشت داخلی ثبت شد؛ برای شرکت نمایش داده نمی‌شود.', 'info');
};
/* assignee <select> inside the expert drawer */
FORMS.assigneeChange = el => {
  const c = findCase(overlay.key.split(':')[1]);
  if (!c || c.assignee === el.value) return;
  c.assignee = el.value; c.updated = Date.now();
  c.history.push({ at: c.updated, kind: 'assign', role: 'expert', by: `${USERS.expert.name} — میز خدمت`, text: `مسئول پیگیری: ${el.value}` });
  save();
  rerender();
  toast(`مسئول پیگیری به «${el.value}» تغییر کرد.`, 'info');
};

</script>
  <script>
/* Lighter sidebar sections: services & permits, training & events, company profile.
   They reuse the same forms and data as the main pages, so nothing here is decorative. */

/* ---------- services & permits ---------- */
PAGES.services = {
  title: 'خدمات و مجوزها',
  render() {
    const recent = myCases().filter(c => c.cat !== 'export').sort((a, b) => b.updated - a.updated).slice(0, 4);
    return pageHead('خدمات و مجوزها', 'درخواست‌های مرتبط با مجوزها و خدمات زیربنایی را از یک جا ثبت کنید؛ پیگیری همه آن‌ها در میز خدمت انجام می‌شود.') +
      `<div class="notice tone-amber">${icon('info')}<span>در این نسخه نمایشی، درخواست‌ها فقط داخل همین دمو ثبت و پیگیری می‌شوند و به هیچ سامانه رسمی متصل نیستند. زمان‌های رسیدگی هم نمونه‌اند.</span></div>
      <div class="svc-grid">${SERVICES.map(s => {
        const cat = CASE_CATS[s.cat];
        return `<article class="svc card">
          <div class="svc-top">${iconTile(cat.icon, cat.tone, 'lg')}${catChip(CASE_CATS, s.cat)}</div>
          <h3>${s.title}</h3><p>${s.desc}</p>
          <div class="svc-foot"><span class="meta"><span>${icon('clock')}حدود ${fa(s.eta)} روز کاری</span></span>
            <button class="btn btn-soft btn-sm" data-action="new-case" data-cat="${s.cat}" data-title="${esc(s.title)}">ثبت درخواست</button></div>
        </article>`;
      }).join('')}</div>
      <section class="card svc-recent">
        <div class="card-head"><h2>درخواست‌های اخیر شما</h2><a class="link" href="#/desk">پیگیری در میز خدمت${icon('chevLeft')}</a></div>
        <ul class="rows">${recent.map(c => `<li><button class="row-btn" data-action="open" data-id="${c.id}">${iconTile(CASE_CATS[c.cat].icon, CASE_CATS[c.cat].tone, 'sm')}
          <span class="row-main"><strong>${esc(c.title)}</strong><small>${code(c.id)} · ${jDate(c.created)}</small></span>${statusPill(c.status)}</button></li>`).join('')}</ul>
      </section>`;
  }
};

/* ---------- training & events ---------- */
const EVENT_TABS = [['all', 'همه'], ['expo', 'رویداد و نشست'], ['training', 'آموزش'], ['notice', 'اطلاعیه']];
const eventMatches = (e, t) => t === 'all' || e.type === t || (t === 'expo' && e.type === 'meeting');

function eventCard(e) {
  const reg = state.registrations[e.id], d = new Date(e.date), left = e.seats ? e.seats - e.taken - (reg ? 1 : 0) : null;
  const act = e.type === 'notice'
    ? `<button class="btn btn-ghost btn-sm" data-action="open" data-id="${e.id}">مطالعه اطلاعیه</button>`
    : reg ? `<span class="pill tone-green">${icon('check')}ثبت‌نام شدید</span><button class="link" data-action="unregister" data-id="${e.id}">لغو</button>`
      : `<button class="btn btn-primary btn-sm" data-action="register" data-id="${e.id}">ثبت‌نام</button>`;
  return `<article class="ecard card">
    <div class="edate ${toneCls(EVENT_TYPES[e.type].tone)}"><b>${fmtDay.format(d)}</b><span>${fmtMonth.format(d)}</span><small>${fmtWeekday.format(d)}</small></div>
    <div class="ebody">
      <div class="ncard-top">${catChip(EVENT_TYPES, e.type)}<span class="muted">${until(e.date)}</span></div>
      <h3>${esc(e.title)}</h3>
      <div class="meta"><span>${icon('pin')}${esc(e.place)}</span>${e.type !== 'notice' ? `<span>${icon(e.mode === 'آنلاین' ? 'globe' : 'users')}${e.mode}</span>` : ''}${left != null ? `<span>${icon('users')}${fa(left)} جای خالی</span>` : ''}</div>
      <p class="edesc">${esc(e.desc)}</p>
    </div>
    <div class="eact">${act}<button class="link" data-action="open" data-id="${e.id}">جزئیات${icon('chevLeft')}</button></div>
  </article>`;
}

PAGES.events = {
  title: 'آموزش و رویدادها',
  render() {
    const t = ui.events.type, list = state.events.filter(e => eventMatches(e, t)).sort((a, b) => a.date - b.date);
    const regs = state.events.filter(e => state.registrations[e.id]).length;
    return pageHead('آموزش و رویدادها', 'نمایشگاه‌ها، نشست‌های تخصصی، دوره‌های آموزشی و اطلاعیه‌های شهرک‌ها؛ ثبت‌نام شما در همین دمو نگه داشته می‌شود.',
      regs ? `<span class="pill tone-green">${icon('check')}${fa(regs)} ثبت‌نام فعال</span>` : '') +
      `<div class="fchips">${EVENT_TABS.map(([k, l]) => chip(l, t === k, 'ev-tab', `data-val="${k}"`, state.events.filter(e => eventMatches(e, k)).length)).join('')}${demoTag('رویدادها نمونه‌اند')}</div>
      <div class="elist">${list.map(eventCard).join('')}</div>`;
  }
};

ACTIONS['ev-tab'] = el => { ui.events.type = el.dataset.val; rerender(); };
ACTIONS.register = el => {
  const e = findEvent(el.dataset.id);
  state.registrations[e.id] = Date.now();
  notify('company', { icon: 'calendar', tone: 'orange', text: `ثبت‌نام شما در «${e.title}» انجام شد.`, link: { page: 'events', open: e.id } });
  save();
  rerender();
  toast(`ثبت‌نام در «${e.title}» انجام شد (نمایشی).`);
};
ACTIONS.unregister = el => {
  delete state.registrations[el.dataset.id];
  save();
  rerender();
  toast('ثبت‌نام لغو شد.', 'info');
};

function openEvent(id) {
  const e = findEvent(id);
  if (!e) return toast('این رویداد پیدا نشد.', 'warn');
  const reg = state.registrations[e.id], d = new Date(e.date), taken = (e.taken || 0) + (reg ? 1 : 0);
  openPanel({
    size: 'md', key: 'event:' + id, reopen: () => openEvent(id), title: e.title,
    sub: `${catChip(EVENT_TYPES, e.type)}${demoTag(e.type === 'notice' ? 'اطلاعیه نمونه' : 'رویداد نمونه')}`,
    body: `<div class="kv">
        <div><div class="k">تاریخ</div><div class="v">${fmtWeekday.format(d)} ${jLong(e.date)}</div></div>
        <div><div class="k">زمان باقی‌مانده</div><div class="v">${until(e.date)}</div></div>
        <div><div class="k">محل</div><div class="v">${esc(e.place)}</div></div>
        <div><div class="k">نحوه برگزاری</div><div class="v">${e.mode}</div></div>
      </div>
      <div class="sec"><p class="prose">${esc(e.desc)}</p></div>
      ${e.seats ? `<div class="sec"><div class="progress"><i style="width:${Math.round(taken / e.seats * 100)}%"></i></div><p class="small-note">${fa(taken)} نفر از ظرفیت ${fa(e.seats)} نفر ثبت‌نام کرده‌اند (نمایشی).</p></div>` : ''}`,
    footer: e.type === 'notice' ? '<button class="btn btn-ghost" data-action="close">بستن</button>'
      : reg ? `<button class="btn btn-done" disabled>${icon('check')}ثبت‌نام شدید</button><button class="btn btn-ghost" data-action="unregister" data-id="${e.id}">لغو ثبت‌نام</button>`
        : `<button class="btn btn-primary" data-action="register" data-id="${e.id}">${icon('check')}ثبت‌نام</button><button class="btn btn-ghost" data-action="close">بستن</button>`
  });
}

/* ---------- company profile ---------- */
PAGES.profile = {
  title: 'پروفایل شرکت',
  render() {
    const c = COMPANIES[ME], prods = state.products.filter(p => p.company === ME), needs = state.needs.filter(x => x.company === ME), cases = myCases();
    return pageHead('پروفایل شرکت', 'اطلاعات پایه شرکت که در تطبیق نیازها، صادرات و میز خدمت به کار می‌رود.') +
      `<section class="card prof-head">
        <span class="prof-logo">${icon('factory')}</span>
        <div class="prof-id"><h2>${c.name}</h2><p>${c.field}</p>
          <div class="meta"><span>${icon('pin')}${c.park} — ${c.plot}</span><span>${icon('calendar')}تأسیس ${fa(c.founded)}</span><span>${icon('users')}${fa(c.staff)} نفر</span><span>${icon('user')}${USERS.company.name}، ${USERS.company.title}</span></div></div>
        <div class="prof-side">${demoTag('شرکت فرضی')}<div class="std">${c.certs.map(s => `<span class="tag hit">${icon('shield')}${s}</span>`).join('')}</div></div>
      </section>
      <div class="prof-grid">
        <section class="card"><div class="card-head"><h2>محصولات صادراتی</h2><a class="link" href="#/export">صادرات${icon('chevLeft')}</a></div>
          <ul class="rows">${prods.map(p => `<li><button class="row-btn" data-action="open" data-id="${p.id}">${iconTile(PRODUCT_CATS[p.cat].icon, PRODUCT_CATS[p.cat].tone, 'sm')}<span class="row-main"><strong>${esc(p.name)}</strong><small>ظرفیت: ${esc(p.capacity)}</small></span><span class="flags">${p.markets.map(m => flag(m, 'sm')).join('')}</span></button></li>`).join('')}</ul></section>
        <section class="card"><div class="card-head"><h2>نیازها و فرصت‌های ثبت‌شده</h2><button class="link" data-action="my-needs">همه${icon('chevLeft')}</button></div>
          <ul class="rows">${needs.slice(0, 4).map(x => `<li><button class="row-btn" data-action="open" data-id="${x.id}">${iconTile(NEED_CATS[x.cat].icon, NEED_CATS[x.cat].tone, 'sm')}<span class="row-main"><strong>${esc(x.title)}</strong><small>${timeAgo(x.created)}</small></span>${kindBadge(x.kind)}</button></li>`).join('')}</ul></section>
        <section class="card"><div class="card-head"><h2>پرونده‌های میز خدمت</h2><a class="link" href="#/desk">میز خدمت${icon('chevLeft')}</a></div>
          <div class="prof-status">${STATUSES.map(s => `<button class="ps ${toneCls(s.tone)}" data-action="desk-filter" data-val="${s.key}"><b>${fa(caseCount(cases, s.key))}</b><span>${s.label}</span></button>`).join('')}</div></section>
      </div>`;
  }
};

ACTIONS['my-needs'] = () => { Object.assign(ui.needs, { q: '', cat: 'all', kind: 'all', mine: true }); go('needs'); };
ACTIONS['desk-filter'] = el => { Object.assign(ui.desk, { q: '', cat: 'all', status: el.dataset.val }); go('desk'); };

</script>
  <script>
/* Wiring: one delegated listener per event type, the global search, and start-up. */

ACTIONS.close = () => closeOverlay();
ACTIONS.go = el => go(el.dataset.page, el.dataset.open || null);
ACTIONS.open = el => openItem(el.dataset.id);
ACTIONS['toggle-notifs'] = () => togglePop('notifPop');
ACTIONS['toggle-usermenu'] = () => togglePop('userPop');
ACTIONS['toggle-nav'] = () => document.body.classList.toggle('nav-open');
ACTIONS.role = el => {
  const to = el.dataset.role, changed = to !== role();
  closePopovers();
  go(to === 'expert' ? 'expert' : 'dashboard');
  if (changed) toast(to === 'expert' ? 'اکنون به‌عنوان کارشناس شهرک وارد شده‌اید و درخواست‌های همه شرکت‌ها را می‌بینید.' : 'اکنون به‌عنوان شرکت وارد شده‌اید.', 'info');
};
ACTIONS['read-all'] = () => {
  state.notifications.forEach(n => { if (n.role === role()) n.read = true; });
  save(); renderChrome(); renderNotifs();
};
ACTIONS.notif = el => {
  const n = state.notifications.find(x => x.id === el.dataset.id);
  if (!n) return;
  n.read = true; save(); closePopovers();
  if (n.link) go(n.link.page, n.link.open || null); else renderChrome();
};
ACTIONS.reset = () => {
  closePopovers();
  openPanel({
    size: 'sm', key: 'reset', title: 'بازنشانی داده‌های دمو',
    body: '<p class="prose">همه ثبت‌ها و تغییرات این جلسه پاک می‌شود و دمو به داده‌های نمونه اولیه برمی‌گردد. برای شروع یک ارائه تازه مناسب است.</p>',
    footer: `<button class="btn btn-primary" data-action="reset-yes">${icon('reset')}بازنشانی</button><button class="btn btn-ghost" data-action="close">انصراف</button>`
  });
};
ACTIONS['reset-yes'] = () => {
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
  state = seedState();
  Object.assign(ui.needs, { q: '', cat: 'all', kind: 'all', mine: false });
  Object.assign(ui.export, { q: '', market: 'all', cat: 'all' });
  Object.assign(ui.desk, { q: '', status: 'all', cat: 'all' });
  Object.assign(ui.expert, { q: '', status: 'open', cat: 'all', priority: 'all' });
  ui.events.type = 'all';
  save();
  go('dashboard');
  renderPage('dashboard');
  toast('داده‌های دمو به حالت اولیه برگشت.');
};

/* ---------- global search ---------- */
let srItems = [], srIndex = -1;
function renderSearch() {
  const q = $('#searchInput').value, box = $('#searchResults');
  srItems = searchAll(q); srIndex = -1;
  if (norm(q).length < 2) { box.hidden = true; return; }
  let html = '', group = '';
  srItems.forEach((r, i) => {
    if (r.group !== group) { group = r.group; html += `<div class="sr-group">${group}</div>`; }
    html += `<button class="sr-item" data-action="sr" data-i="${i}">${iconTile(r.icon, r.tone, 'sm')}<span><strong>${esc(r.title)}</strong><small>${withCodes(r.meta)}</small></span></button>`;
  });
  box.innerHTML = html || `<p class="sr-empty">نتیجه‌ای برای «${esc(q)}» پیدا نشد.</p>`;
  box.hidden = false;
}
ACTIONS.sr = el => {
  const r = srItems[+el.dataset.i];
  $('#searchInput').value = '';
  $('#searchResults').hidden = true;
  $('#searchInput').blur();
  go(r.page, r.open);
};

/* ---------- delegated listeners ---------- */
const setFilter = el => { const [pg, key] = el.dataset.filter.split('.'); ui[pg][key] = el.value; };

document.addEventListener('click', e => {
  const t = e.target;
  if (!t.closest('.pop-wrap') && !t.closest('#search')) closePopovers();
  if (t.closest('.nav-item')) document.body.classList.remove('nav-open');
  const el = t.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});

document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  if (FORMS[form.dataset.form]) FORMS[form.dataset.form](form);
});

function clearFieldError(form, el) {
  const f = $(`[data-field="${el.name}"]`, form);
  if (f) f.classList.remove('has-error');
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'searchInput') return renderSearch();
  if (el.dataset.filter && el.tagName === 'INPUT') {
    setFilter(el);
    const P = PAGES[ui.page];
    if (P.results && $('#results')) $('#results').innerHTML = P.results(); else rerender();
    return;
  }
  const form = el.closest('form[data-form]');
  if (form) { clearFieldError(form, el); const hook = FORMS[form.dataset.form + 'Input']; if (hook) hook(form, el); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.filter && el.tagName === 'SELECT') { setFilter(el); return rerender(); }
  if (el.dataset.change && ACTIONS[el.dataset.change]) return ACTIONS[el.dataset.change](el);
  if (el.name === 'assignee' && overlay.key && overlay.key.startsWith('xcase:')) return FORMS.assigneeChange(el);
  const form = el.closest('form[data-form]');
  if (form) { clearFieldError(form, el); const hook = FORMS[form.dataset.form + 'Input']; if (hook) hook(form, el); }
});

document.addEventListener('keydown', e => {
  const open = !$('#overlay').hidden;
  if (e.key === 'Escape') {
    if (open) closeOverlay(); else { closePopovers(); document.body.classList.remove('nav-open'); }
    return;
  }
  if (e.key === 'Tab' && open) {
    const f = $$('#overlay .panel button, #overlay .panel [href], #overlay .panel input, #overlay .panel select, #overlay .panel textarea').filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement.classList.contains('panel'))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-action][tabindex]:not(button)')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === '/' && !open && !e.target.closest('input, textarea, select')) { e.preventDefault(); $('#searchInput').focus(); }
});

$('#searchInput').addEventListener('keydown', e => {
  const items = $$('#searchResults .sr-item');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!items.length) return;
    e.preventDefault();
    srIndex = (srIndex + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((x, i) => x.classList.toggle('active', i === srIndex));
    items[srIndex].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const it = items[srIndex >= 0 ? srIndex : 0];
    if (it) it.click();
  }
});
$('#searchInput').addEventListener('focus', () => { if (norm($('#searchInput').value).length >= 2) renderSearch(); });

/* Two windows of the demo (e.g. company + expert side by side) stay in sync. */
window.addEventListener('storage', e => {
  if (e.key !== STORE_KEY) return;
  state = loadState();
  renderPage(ui.page, true);
});
window.addEventListener('hashchange', onHashChange);

/* ---------- start ---------- */
$('#brandMark').innerHTML = icon('factory');
$('#searchIco').innerHTML = icon('search');
if (!location.hash) history.replaceState(null, '', '#/dashboard');
renderPage(pageFromHash());

</script>
