/* Base: tokens, layout (header + sidebar), shared components, overlays, responsive rules. */
:root {
  --navy-900: #081230; --navy-800: #0E1F45; --navy-700: #15295A;
  --blue-600: #1462F0; --blue-500: #2B74FF; --blue-50: #EDF3FF;
  --green: #12A150; --red: #E5484D;
  --bg: #F3F6FB; --bg-2: #F1F4F9; --card: #FFFFFF; --line: #E4E9F2; --line-2: #EEF2F7;
  --ink: #0F1B33; --ink-2: #364258; --muted: #6B7489;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px -12px rgba(16, 24, 40, .10);
  --shadow-lg: 0 24px 64px -16px rgba(8, 18, 48, .30);
  --top-h: 76px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; font-family: Vazirmatn, "Segoe UI", Tahoma, sans-serif; font-size: 14px; line-height: 1.75; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
h1, h2, h3, h4, p, ol, ul { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
.i { width: 20px; height: 20px; flex-shrink: 0; display: block; }
:focus-visible { outline: 3px solid rgba(43, 116, 255, .45); outline-offset: 2px; }
::selection { background: #CFE0FF; }

/* tones: --tc = foreground, --tb = soft background */
.tone-blue { --tc: #1D5FE0; --tb: #EAF1FF; }
.tone-green { --tc: #0F8A46; --tb: #E5F6EC; }
.tone-orange { --tc: #D9650B; --tb: #FFF0E1; }
.tone-purple { --tc: #6D41D8; --tb: #F1ECFE; }
.tone-sky { --tc: #0779B8; --tb: #E3F3FC; }
.tone-amber { --tc: #A35F05; --tb: #FFF4D6; }
.tone-red { --tc: #D23B41; --tb: #FDECEC; }
.tone-gray { --tc: #4B5568; --tb: #EEF1F6; }
.tone-slate { --tc: #3A4A6B; --tb: #E7ECF4; }
.tone-indigo { --tc: #4446C9; --tb: #ECEDFD; }

/* ---------- header ---------- */
.topbar { position: sticky; top: 0; z-index: 40; height: var(--top-h); display: flex; align-items: center; gap: 20px; padding: 0 24px; background: rgba(255, 255, 255, .94); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; flex-shrink: 0; min-width: 0; }
.brand-mark { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: linear-gradient(140deg, #3B82FF 0%, #1252D6 45%, #0A1633 100%); box-shadow: 0 8px 18px -8px rgba(20, 98, 240, .7); }
.brand-mark .i { width: 24px; height: 24px; }
.brand-text strong { display: block; font-size: 17px; font-weight: 900; line-height: 1.5; }
.brand-text small { display: block; font-size: 12px; color: var(--muted); line-height: 1.5; }
.search { position: relative; flex: 1; max-width: 460px; margin-inline: auto; }
.search-ico { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg-2); padding-inline: 44px 14px; font-size: 13.5px; transition: background .15s, border-color .15s, box-shadow .15s; }
.search input:focus { outline: none; background: #fff; border-color: var(--blue-500); box-shadow: 0 0 0 4px rgba(43, 116, 255, .14); }
.search-results { position: absolute; top: calc(100% + 8px); inset-inline: 0; background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); z-index: 60; padding: 6px; max-height: 70vh; overflow-y: auto; }
.sr-group { font-size: 11.5px; color: var(--muted); font-weight: 700; padding: 10px 10px 4px; }
.sr-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 10px; border: 0; background: none; text-align: start; cursor: pointer; }
.sr-item:hover, .sr-item.active { background: var(--bg-2); }
.sr-item strong { display: block; font-size: 13.5px; font-weight: 700; line-height: 1.6; }
.sr-item small { display: block; font-size: 12px; color: var(--muted); }
.sr-empty { padding: 18px; text-align: center; color: var(--muted); font-size: 13px; }
.top-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.demo-badge { font-size: 12px; font-weight: 700; color: #8A5A00; background: #FFF6DD; border: 1px solid #F3DC9A; padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
.role-switch { display: flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.role-switch button { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 9px; border: 0; background: transparent; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
.role-switch button .i { width: 16px; height: 16px; }
.role-switch button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(16, 24, 40, .14); }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink-2); cursor: pointer; position: relative; flex-shrink: 0; }
.icon-btn:hover { background: var(--bg-2); }
.icon-btn .i { width: 22px; height: 22px; }
.only-mobile { display: none !important; }
.bell-count { position: absolute; top: 3px; inset-inline-end: 3px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--red); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; border: 2px solid #fff; line-height: 1; }
.user-chip { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 4px 6px; border-radius: 14px; cursor: pointer; text-align: start; }
.user-chip:hover { background: var(--bg-2); }
.user-chip > .i { width: 16px; height: 16px; color: var(--muted); }
.avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; background: linear-gradient(135deg, #3B82F6, #1E3A8A); flex-shrink: 0; box-shadow: 0 0 0 3px #fff, 0 0 0 4px var(--line); }
.avatar.expert { background: linear-gradient(135deg, #8B5CF6, #4C1D95); }
.avatar.lg { width: 50px; height: 50px; font-size: 15px; }
.who strong { display: block; font-size: 14px; font-weight: 800; line-height: 1.5; }
.who small { display: block; font-size: 12px; color: var(--muted); line-height: 1.5; }

/* popovers */
.pop-wrap { position: relative; }
.popover { position: absolute; top: calc(100% + 10px); inset-inline-end: 0; width: 370px; background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); z-index: 60; overflow: hidden; animation: pop .16s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(-6px); } }
.pop-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line-2); }
.pop-list { max-height: 380px; overflow-y: auto; }
.notif { display: flex; gap: 12px; width: 100%; text-align: start; background: none; border: 0; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--line-2); align-items: flex-start; }
.notif:hover { background: #F7F9FD; }
.notif.unread { background: #F4F8FF; }
.notif.unread .n-text::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--blue-600); margin-inline-end: 6px; vertical-align: middle; }
.n-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.n-text { font-size: 13px; line-height: 1.8; }
.n-body small { color: var(--muted); font-size: 11.5px; }
.pop-foot { font-size: 11.5px; color: var(--muted); padding: 10px 16px; background: #FAFBFD; }
.pop-empty { padding: 24px; text-align: center; color: var(--muted); }
.user-pop { width: 310px; padding: 8px; }
.user-card { display: flex; gap: 12px; align-items: center; padding: 10px 10px 14px; border-bottom: 1px solid var(--line-2); margin-bottom: 6px; }
.user-card strong { display: block; font-weight: 800; }
.user-card small { color: var(--muted); font-size: 12px; line-height: 1.7; display: block; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 42px; padding: 0 10px; border-radius: 10px; border: 0; background: none; font-size: 13.5px; font-weight: 600; color: var(--ink); cursor: pointer; text-decoration: none; }
.menu-item:hover { background: var(--bg-2); }
.menu-item .i { width: 18px; height: 18px; color: var(--muted); }
.menu-item.danger, .menu-item.danger .i { color: #C2383E; }
.menu-note { font-size: 11.5px; color: var(--muted); padding: 8px 10px 4px; }

/* ---------- shell + sidebar ---------- */
.shell { display: grid; grid-template-columns: minmax(0, 1fr) 256px; grid-template-areas: "main side"; min-height: calc(100vh - var(--top-h)); }
.main { grid-area: main; padding: 24px 28px 32px; min-width: 0; outline: none; }
.sidebar { grid-area: side; position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); display: flex; flex-direction: column; padding: 18px 12px 0; background: linear-gradient(180deg, #0D1C40 0%, #0A1633 55%, #081230 100%); color: #C9D3EA; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #24396B transparent; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item { position: relative; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border-radius: 12px; color: #C3CDE4; text-decoration: none; font-size: 14px; font-weight: 500; transition: background .15s, color .15s; }
.nav-item .i { width: 21px; height: 21px; color: #8FA0C6; }
.nav-item:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.nav-item.active { background: linear-gradient(270deg, #203D7C, #172E61); color: #fff; font-weight: 700; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); }
.nav-item.active .i { color: #5B95FF; }
.nav-item.active::before { content: ''; position: absolute; inset-inline-start: -12px; top: 12px; bottom: 12px; width: 4px; border-radius: 4px; background: #3B82FF; }
.nav-badge { margin-inline-start: auto; min-width: 22px; height: 22px; border-radius: 11px; background: var(--red); color: #fff; font-size: 11.5px; display: grid; place-items: center; padding: 0 6px; font-weight: 800; line-height: 1; }
.nav-sep { display: flex; align-items: center; gap: 8px; margin: 16px 8px 6px; font-size: 11.5px; font-weight: 700; color: #7F8DB0; }
.nav-sep::after { content: ''; flex: 1; height: 1px; background: rgba(255, 255, 255, .08); }
.side-foot { position: relative; margin-top: auto; padding: 32px 10px 0; min-height: 150px; }
.side-foot p { position: relative; z-index: 1; font-size: 13.5px; font-weight: 600; line-height: 1.9; color: #DCE4F5; }
.side-skyline { position: absolute; inset-inline: 0; bottom: 18px; width: 100%; color: rgba(120, 150, 215, .13); }
.side-wave { position: relative; display: block; width: 100%; height: 48px; }
.nav-scrim { display: none; }

/* ---------- shared components ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card-pad { padding: 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 8px; }
.card-head h2 { font-size: 15.5px; font-weight: 800; }
.card-head .sub { font-size: 12.5px; color: var(--muted); }
.link { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px; border: 0; border-radius: 6px; background: none; color: var(--blue-600); font-size: 12.5px; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; }
.link:hover { background: var(--blue-50); }
.link .i { width: 15px; height: 15px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .15s, border-color .15s, box-shadow .15s, transform .1s; }
.btn .i { width: 18px; height: 18px; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .65; cursor: default; transform: none; }
.btn-primary { background: var(--blue-600); color: #fff; box-shadow: 0 10px 20px -12px rgba(20, 98, 240, .95); }
.btn-primary:hover { background: #0F55D6; }
.btn-ghost { background: #fff; border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { border-color: #C9D3E6; background: #FAFBFE; }
.btn-soft { background: var(--blue-50); color: var(--blue-600); }
.btn-soft:hover { background: #DFEAFF; }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: #0E8C45; }
.btn-done { background: #E5F6EC; color: #0F8A46; }
.btn-sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn-block { width: 100%; }
.itile { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--tb); color: var(--tc); flex-shrink: 0; }
.itile.sm { width: 36px; height: 36px; border-radius: 10px; }
.itile.sm .i { width: 18px; height: 18px; }
.itile.lg { width: 52px; height: 52px; border-radius: 14px; }
.itile.lg .i { width: 26px; height: 26px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--tb); color: var(--tc); font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill .i { width: 14px; height: 14px; }
.prio { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--tc); white-space: nowrap; }
.prio .i { width: 14px; height: 14px; }
.chip-cat { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border-radius: 8px; background: var(--tb); color: var(--tc); font-size: 12px; font-weight: 700; white-space: nowrap; }
.chip-cat .i { width: 15px; height: 15px; }
.badge-new { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: #FDECEC; color: #D23B41; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
.badge-mine { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: #EAF1FF; color: #1D5FE0; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
.kind { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; border: 1px solid; white-space: nowrap; }
.kind-need { color: #1D5FE0; border-color: #C9DBFF; background: #F5F9FF; }
.kind-offer { color: #0F8A46; border-color: #BFE8CF; background: #F3FBF6; }
.code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .9em; letter-spacing: .2px; color: var(--ink-2); unicode-bidi: isolate; white-space: nowrap; }
.demo-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: #8A5A00; background: #FFF6DD; border: 1px dashed #EAC567; padding: 2px 8px; border-radius: 8px; white-space: nowrap; }
.demo-tag .i { width: 14px; height: 14px; }
.muted { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--muted); font-size: 12.5px; }
.meta span { display: inline-flex; align-items: center; gap: 5px; }
.meta .i { width: 15px; height: 15px; }
.flag { display: inline-block; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px rgba(15, 27, 51, .1); line-height: 0; flex-shrink: 0; }
.flag svg { display: block; width: 100%; height: 100%; }
.flag-sm { width: 21px; height: 14px; border-radius: 3px; }
.flag-md { width: 30px; height: 20px; }
.flag-lg { width: 42px; height: 28px; border-radius: 6px; }
.flags { display: inline-flex; gap: 4px; align-items: center; }

/* page head + toolbars */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { font-size: 23px; font-weight: 900; letter-spacing: -.2px; line-height: 1.6; }
.page-head p { color: var(--muted); margin-top: 4px; font-size: 14px; max-width: 680px; line-height: 1.9; }
.page-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.tsearch { position: relative; flex: 1 1 240px; max-width: 360px; }
.tsearch .i { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.tsearch input { width: 100%; height: 42px; padding-inline: 40px 12px; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
.tsearch input:focus, .tselect:focus { outline: none; border-color: var(--blue-500); box-shadow: 0 0 0 4px rgba(43, 116, 255, .12); }
.tselect { height: 42px; border-radius: 12px; border: 1px solid var(--line); background: #fff; padding: 0 12px; font-size: 13.5px; min-width: 140px; }
.fchips { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.fchip:hover { border-color: #C9D3E6; }
.fchip .i { width: 16px; height: 16px; }
.fchip b { font-size: 11.5px; background: var(--bg-2); color: var(--muted); padding: 0 7px; border-radius: 6px; line-height: 1.7; }
.fchip.on { background: var(--navy-800); color: #fff; border-color: var(--navy-800); }
.fchip.on b { background: rgba(255, 255, 255, .16); color: #fff; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty > .i { width: 36px; height: 36px; color: #B4BDCE; margin: 0 auto 8px; }
.empty p { margin-bottom: 12px; }
.foot-note { display: flex; gap: 8px; align-items: flex-start; margin-top: 28px; padding: 12px 16px; border-radius: 12px; border: 1px dashed #D3DBEA; color: var(--muted); font-size: 12.5px; line-height: 1.9; }
.foot-note .i { width: 16px; height: 16px; margin-top: 4px; }

/* stepper */
.stepper { display: flex; padding: 4px 0 0; }
.stepper li { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; text-align: center; min-width: 0; }
.stepper li::before { content: ''; position: absolute; top: 15px; inset-inline-start: 50%; width: 100%; height: 2px; background: var(--line); }
.stepper li:last-child::before { display: none; }
.stepper li.done::before { background: var(--green); }
.st-dot { position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 2px solid var(--line); color: var(--muted); font-weight: 800; font-size: 13px; }
.st-dot .i { width: 16px; height: 16px; }
.stepper li.done .st-dot { background: var(--green); border-color: var(--green); color: #fff; }
.stepper li.current .st-dot { background: var(--blue-600); border-color: var(--blue-600); color: #fff; box-shadow: 0 0 0 5px rgba(43, 116, 255, .16); }
.st-label { font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.6; }
.stepper li.current .st-label { color: var(--ink); }
.mini-steps { display: inline-flex; gap: 3px; }
.mini-steps i { width: 14px; height: 4px; border-radius: 2px; background: var(--line); }
.mini-steps i.on { background: var(--blue-500); }

/* tables */
.table-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.tbl th { text-align: start; font-size: 12px; color: var(--muted); font-weight: 700; padding: 12px 14px; background: #F8FAFD; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 13px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.row { cursor: pointer; }
.tbl tr.row:hover td { background: #F7F9FD; }
.tbl tr.row.flash td { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: #FFF6D6; } }
.t-title { display: flex; align-items: center; gap: 12px; min-width: 220px; }
.t-title strong { display: block; font-weight: 700; line-height: 1.6; }
.t-title small { display: block; color: var(--muted); font-size: 12px; }
.t-go { color: #A3ADC0; }

/* ---------- forms ---------- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.field > label, .field > .label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.field input:not([type=radio]):not([type=checkbox]), .field select, .field textarea { width: 100%; height: 44px; border-radius: 12px; border: 1px solid #D8DFEB; background: #fff; padding: 0 12px; font-size: 14px; transition: border-color .15s, box-shadow .15s; }
.field textarea { height: auto; min-height: 92px; padding: 10px 12px; resize: vertical; line-height: 1.9; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--blue-500); box-shadow: 0 0 0 4px rgba(43, 116, 255, .14); }
.field .hint { font-size: 12px; color: var(--muted); }
.field-error { display: none; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #C2383E; }
.field-error .i { width: 15px; height: 15px; }
.field.has-error .field-error { display: flex; }
.field.has-error input:not([type=radio]):not([type=checkbox]), .field.has-error select, .field.has-error textarea { border-color: var(--red); box-shadow: 0 0 0 4px rgba(229, 72, 77, .1); }
.field.has-error .seg, .field.has-error .tile-pick, .field.has-error .checks { outline: 2px solid rgba(229, 72, 77, .45); outline-offset: 4px; border-radius: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; }
.seg-opt { position: relative; flex: 1; min-width: 70px; }
.seg-opt input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; }
.seg-opt span { display: flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 8px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; transition: background .15s; }
.seg-opt span .i { width: 16px; height: 16px; }

/* --- Hero illustrations: drawn at 960x320, anchored right (slice). --- */
function seeded(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }

function heroSky(id, top, mid, low, glow) {
  return `<defs>
    <linearGradient id="sky${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset=".62" stop-color="${mid}"/><stop offset="1" stop-color="${low}"/></linearGradient>
    <radialGradient id="glow${id}" cx=".72" cy=".86" r=".5"><stop offset="0" stop-color="${glow}" stop-opacity=".75"/><stop offset="1" stop-color="${glow}" stop-opacity="0"/></radialGradient>
    <filter id="blur${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>
  <rect width="960" height="320" fill="url(#sky${id})"/><rect width="960" height="320" fill="url(#glow${id})"/>`;
}

function lights(points, id) {
  const dots = points.map(([x, y, r = 1.6]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('');
  return `<g fill="#FFC56B" filter="url(#blur${id})" opacity=".9">${dots}</g><g fill="#FFE6B0">${dots}</g>`;
}

function artRefinery() {
  const id = 'r', rnd = seeded(7), pts = [], g = [];
  const towers = [[600, 120, 20], [640, 84, 26], [700, 58, 30], [756, 104, 20], [872, 72, 26], [912, 118, 18]];
  towers.forEach(([x, y, w]) => {
    g.push(`<rect x="${x}" y="${y}" width="${w}" height="${270 - y}" rx="${w / 2.4}" fill="#0D1B3D"/>`);
    g.push(`<rect x="${x + w * .18}" y="${y + 6}" width="${w * .12}" height="${264 - y}" fill="#1B3166" opacity=".8"/>`);
    for (let yy = y + 18; yy < 262; yy += 26) {
      g.push(`<rect x="${x - 5}" y="${yy}" width="${w + 10}" height="2.4" fill="#16295A"/>`);
      pts.push([x - 3 + rnd() * 4, yy - 2], [x + w + 1 - rnd() * 4, yy - 2]);
    }
    pts.push([x + w / 2, y - 2, 2]);
  });
  g.push('<rect x="812" y="34" width="7" height="236" fill="#0D1B3D"/><path d="M815.5 34c-6-8-1-15 0-22 3 6 7 11 0 22z" fill="#FFB24D"/><path d="M815.5 32c-3-4-.5-8 0-12 2 4 3.5 7 0 12z" fill="#FFE7A8"/>');
  g.push('<g stroke="#122453" stroke-width="2" fill="none"><path d="M770 270V150h56v120M770 180h56M770 210h56M770 240h56M770 150l56 30M826 180l-56 30M770 210l56 30"/></g>');
  for (let i = 0; i < 8; i++) pts.push([772 + rnd() * 52, 152 + rnd() * 110, 1.3]);
  g.push('<rect x="500" y="222" width="104" height="48" rx="4" fill="#0F2148"/><ellipse cx="552" cy="222" rx="52" ry="7" fill="#1A3268"/><rect x="926" y="232" width="60" height="38" rx="4" fill="#0F2148"/><ellipse cx="956" cy="232" rx="30" ry="5" fill="#1A3268"/>');
  g.push('<g stroke="#1A3268" stroke-width="3"><path d="M604 248h270M604 258h330"/></g>');
  for (let x = 508; x < 600; x += 13) pts.push([x, 238 + rnd() * 18, 1.2]);
  const ground = '<rect y="268" width="960" height="52" fill="#081330"/><rect y="268" width="960" height="2" fill="#20407F" opacity=".7"/>';
  const refl = `<g opacity=".25" fill="#FFC56B">${pts.slice(0, 26).map(([x]) => `<rect x="${x - .6}" y="${276 + rnd() * 30}" width="1.2" height="${4 + rnd() * 8}"/>`).join('')}</g>`;
  return heroSky(id, '#0A1A40', '#1B4A93', '#4D79BC', '#FFA94D') + g.join('') + ground + refl + lights(pts, id);
}

function artPort() {
  const id = 'p', rnd = seeded(3), g = [], pts = [];
  const colors = ['#E0533D', '#2F6FD6', '#F2A93B', '#3BA672', '#7E5BD8', '#C9D2E3', '#1E8C9A'];
  for (let row = 0; row < 3; row++) {
    for (let x = 520 + row * 12; x < 880 - row * 20; x += 46) {
      const y = 232 - row * 20, c = colors[Math.floor(rnd() * colors.length)];
      g.push(`<rect x="${x}" y="${y}" width="44" height="18" rx="1.5" fill="${c}" opacity=".92"/><path d="M${x + 6} ${y + 3}v12M${x + 13} ${y + 3}v12M${x + 20} ${y + 3}v12M${x + 27} ${y + 3}v12M${x + 34} ${y + 3}v12" stroke="#000" stroke-opacity=".18"/>`);
    }
  }
  g.push('<path d="M480 252h470l-26 30H510z" fill="#0B1836"/><rect x="480" y="250" width="470" height="4" fill="#1D3A75"/>');
  g.push('<g stroke="#F0B44C" stroke-width="4" fill="none" stroke-linejoin="round"><path d="M900 252V96M940 252V96M884 96h120M900 130h40M900 170h40M900 210h40M900 130l40 40M940 130l-40 40M900 170l40 40"/><path d="M884 96 820 96"/></g><path d="M832 96v40" stroke="#F0B44C" stroke-width="2"/><rect x="824" y="136" width="18" height="10" fill="#F0B44C"/>');
  for (let i = 0; i < 7; i++) pts.push([900 + rnd() * 40, 100 + rnd() * 140, 1.4]);

}

function artPark() {
  const id = 'k', rnd = seeded(11), g = [], pts = [];
  const shed = (x, w, h) => {
    let teeth = '';
    for (let t = 0; t < w; t += 24) teeth += `l12 -14 l0 14 l12 0 `;
    g.push(`<path d="M${x} 270V${270 - h}${teeth.replace(/l12 0 $/, '')}V270z" fill="#0E1E44"/>`);
    for (let wx = x + 8; wx < x + w - 8; wx += 16) { g.push(`<rect x="${wx}" y="${270 - h + 16}" width="8" height="6" fill="#FFD58A" opacity="${rnd() > .3 ? .85 : .25}"/>`); }
  };
  shed(500, 120, 52); shed(640, 150, 66); shed(806, 96, 46);
  g.push('<g fill="#0E1E44"><rect x="574" y="120" width="44" height="40" rx="10"/><path d="M580 160l-8 110h6l8-110zm32 0 8 110h-6l-8-110z"/><rect x="584" y="200" width="24" height="3"/></g>');
  pts.push([596, 116, 2]);

  pts.push([932, 76, 2]);
  g.push('<rect x="720" y="150" width="9" height="56" fill="#0E1E44"/><rect x="740" y="164" width="7" height="42" fill="#0E1E44"/><g fill="#B8C7E6" opacity=".22"><circle cx="726" cy="136" r="10"/><circle cx="738" cy="122" r="13"/><circle cx="756" cy="110" r="9"/></g>');
  const ground = '<rect y="268" width="960" height="52" fill="#0A1636"/><path d="M480 296h480" stroke="#2E5296" stroke-width="2" stroke-dasharray="18 14"/>';
  for (let i = 0; i < 6; i++) pts.push([520 + i * 70, 278, 1.4]);
  return heroSky(id, '#0B1A3F', '#1A4687', '#5C86C2', '#FFC27A') + g.join('') + ground + lights(pts, id);
}

  <script>
/* Core: helpers, state + persistence, routing, overlays and shared UI pieces.
   Pages register themselves in PAGES; clicks go through ACTIONS, forms through FORMS (see main.js). */

const STORE_KEY = 'hamsanat-demo-v1';
const PAGES = {}, ACTIONS = {}, FORMS = {};
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

/* ---------- text, numbers, dates ---------- */
const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
const fa = v => String(v).replace(/\d/g, d => FA_DIGITS[d]);
const faNum = n => new Intl.NumberFormat('fa-IR').format(n);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').toLowerCase()
  .replace(/ي/g, 'ی').replace(/ك/g, 'ک')
  .replace(/[۰-۹]/g, d => FA_DIGITS.indexOf(d))
  .replace(/[‌‎‏\s\-_.،,]+/g, '');

const DAY = 864e5;
const fmtDate = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { year: 'numeric', month: '2-digit', day: '2-digit' });
const fmtLong = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { day: 'numeric', month: 'long', year: 'numeric' });
const fmtDay = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { day: 'numeric' });
const fmtMonth = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { month: 'long' });
const fmtWeekday = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { weekday: 'long' });
const fmtTime = new Intl.DateTimeFormat('fa-IR', { hour: '2-digit', minute: '2-digit' });
const jDate = t => fmtDate.format(new Date(t));
const jLong = t => fmtLong.format(new Date(t));
const jTime = t => fmtTime.format(new Date(t));
const jYear = () => parseInt(new Intl.DateTimeFormat('en-u-ca-persian', { year: 'numeric' }).format(new Date()), 10) || 1405;
const daysSince = t => Math.floor((Date.now() - t) / DAY);

function timeAgo(t) {
  const m = Math.round((Date.now() - t) / 6e4);
  if (m < 1) return 'همین حالا';
  if (m < 60) return `${fa(m)} دقیقه پیش`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${fa(h)} ساعت پیش`;
  const d = Math.floor(h / 24);
  if (d === 1) return 'دیروز';
  return d < 30 ? `${fa(d)} روز پیش` : jDate(t);
}
function until(t) {
  const d = Math.ceil((t - Date.now()) / DAY);
  if (d <= 0) return 'امروز';
  return d === 1 ? 'فردا' : `${fa(d)} روز دیگر`;
}

/* ---------- state ---------- */
let state = loadState();
const ui = {
  page: 'dashboard', slide: 0,
  needs: { q: '', cat: 'all', kind: 'all', mine: false },
  export: { q: '', market: 'all', cat: 'all' },
  desk: { q: '', status: 'all', cat: 'all' },
  expert: { q: '', status: 'open', cat: 'all', priority: 'all' },
  events: { type: 'all' }
};
const role = () => (ui.page === 'expert' ? 'expert' : 'company');
const ROLE_LABEL = { company: 'ورود به‌عنوان شرکت', expert: 'ورود به‌عنوان کارشناس شهرک' };

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (s && s.version === 1) return s;
  } catch (e) { /* storage blocked or corrupt: start fresh */ }
  return seedState();
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* demo keeps working in memory */ }
}

const companyOf = x => COMPANIES[x.company];
const myCases = () => state.cases.filter(c => c.company === ME);
const findNeed = id => state.needs.find(x => x.id === id);
const findCase = id => state.cases.find(x => x.id === id);
const findProduct = id => state.products.find(x => x.id === id);
const findEvent = id => state.events.find(x => x.id === id);
const extractTags = text => KEYWORDS.filter(k => norm(text).includes(norm(k)));

function notify(forRole, n) {
  state.notifications.unshift({ id: 'n' + (++state.seq.notif), role: forRole, at: Date.now(), read: false, ...n });
}

/* ---------- business rules (all simple and rule-based, no AI) ---------- */
function matchesFor(item, limit = 3) {
  const mine = companyOf(item);
  return state.needs
    .filter(x => x.kind !== item.kind && x.cat === item.cat && x.company !== item.company)
    .map(x => {
      const other = companyOf(x), reasons = [`هم‌دسته در «${NEED_CATS[x.cat].label}»`];
      let score = 30;
      const shared = x.tags.filter(t => item.tags.includes(t));
      if (shared.length) { score += Math.min(40, shared.length * 20); reasons.push(`کلیدواژه مشترک: ${shared.join('، ')}`); }
      if (other.city === mine.city) { score += 12; reasons.push(`هر دو در ${other.city}؛ حمل و هماهنگی ساده‌تر`); }
      const [need, offer] = item.kind === 'need' ? [item, x] : [x, item];
      if (need.amount && offer.amount && need.unit === offer.unit) {
        if (offer.amount >= need.amount) { score += 10; reasons.push(`ظرفیت اعلام‌شده (${faNum(offer.amount)} ${offer.unit}) مقدار نیاز (${faNum(need.amount)}) را پوشش می‌دهد`); }
        else reasons.push(`ظرفیت اعلام‌شده (${faNum(offer.amount)}) بخشی از نیاز (${faNum(need.amount)}) را پوشش می‌دهد`);
      }
      if (other.complete) { score += 4; reasons.push('پروفایل شرکت کامل است'); }
      return { item: x, score: Math.min(96, score), reasons };
    })
    .filter(m => m.score >= 40)
    .sort((a, b) => b.score - a.score || b.item.created - a.item.created)
    .slice(0, limit);
}
const matchLevel = s => (s >= 75 ? ['تطابق بالا', 'green'] : s >= 55 ? ['تطابق خوب', 'blue'] : ['تطابق اولیه', 'gray']);

function followUps() {
  return state.cases
    .filter(c => c.status !== 'closed' && c.status !== 'answered')
    .map(c => {
      const reasons = [], idle = daysSince(c.updated), sla = PRIORITIES[c.priority].sla;
      if (c.priority === 'urgent') reasons.push('اولویت فوری');
      if (c.status === 'new' && daysSince(c.created) >= 1) reasons.push(`${fa(daysSince(c.created))} روز بدون اقدام`);
      else if (idle > sla) reasons.push(`${fa(idle)} روز بدون به‌روزرسانی؛ سررسید ${fa(sla)} روز`);
      return { c, reasons };
    })
    .filter(x => x.reasons.length);
}

function createCase({ cat, title, desc, priority, note = '' }) {
  const now = Date.now(), me = COMPANIES[ME];
  const c = {
    id: `HS-${jYear()}-${String(++state.seq.case).padStart(4, '0')}`, company: ME, cat, title, desc, note, priority,
    status: 'new', assignee: UNITS[0], location: `${me.park} — ${me.plot}`, created: now, updated: now,
    history: [{ at: now, kind: 'status', status: 'new', role: 'company', by: USERS.company.name, text: 'پرونده ثبت شد.' }], notes: []
  };
  state.cases.unshift(c);
  notify('expert', { icon: CASE_CATS[cat].icon, tone: priority === 'urgent' ? 'red' : 'blue', text: `پرونده جدید ${c.id} از «${me.name}» ثبت شد.`, link: { page: 'expert', open: c.id } });
  save();
  return c;
}

function changeStatus(c, status, text, actor) {

  if (actor === 'expert' && c.company === ME) {
    notify('company', { icon: 'message', tone: STATUS[status].tone, text: `پرونده ${c.id} به «${STATUS[status].label}» تغییر کرد.`, link: { page: 'desk', open: c.id } });

/* ---------- search ---------- */
function searchAll(q) {
  const n = norm(q);
  if (n.length < 2) return [];
  const has = (...f) => f.some(v => norm(v).includes(n));
  const out = [], expert = role() === 'expert';
  state.needs.forEach(x => has(x.title, companyOf(x).name, x.desc) && out.push({ group: 'نیازها و فرصت‌ها', ...NEED_CATS[x.cat], title: x.title, meta: companyOf(x).name, page: 'needs', open: x.id }));
  state.products.forEach(p => has(p.name, companyOf(p).name) && out.push({ group: 'محصولات صادراتی', ...PRODUCT_CATS[p.cat], title: p.name, meta: companyOf(p).name, page: 'export', open: p.id }));
  state.cases.filter(c => expert || c.company === ME).forEach(c => has(c.id, c.title, companyOf(c).name) && out.push({ group: 'پرونده‌ها', ...CASE_CATS[c.cat], title: c.title, meta: `${c.id} · ${STATUS[c.status].label}`, page: expert ? 'expert' : 'desk', open: c.id }));
  state.events.forEach(e => has(e.title, e.desc) && out.push({ group: 'آموزش و رویدادها', ...EVENT_TYPES[e.type], title: e.title, meta: jLong(e.date), page: 'events', open: e.id }));
  return out.slice(0, 9);
}

function openItem(id) {
  if (/^[NO]-/.test(id)) return openNeed(id);

function renderPage(page, keepScroll = false) {

/* ---------- overlays (modal + side drawer) and toasts ---------- */
const overlay = { key: null, reopen: null };
/* key identifies what is shown: re-opening the same key (after a state change) keeps the scroll position. */
function openPanel({ kind = 'modal', size = 'md', key = '', title, sub = '', body, footer = '', reopen = null }) {
  const root = $('#overlay'), again = !root.hidden && !!key && overlay.key === key;
  const scroll = again ? $('.panel-body', root).scrollTop : 0;
  root.innerHTML = `<div class="scrim" data-action="close"></div>
    <section class="panel panel-${kind} size-${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}" tabindex="-1">
      <header class="panel-head"><div class="panel-title"><h2>${esc(title)}</h2>${sub ? `<div class="panel-sub">${sub}</div>` : ''}</div>
        <button class="icon-btn" data-action="close" aria-label="بستن">${icon('x')}</button></header>
      <div class="panel-body">${body}</div>
      ${footer ? `<footer class="panel-foot">${footer}</footer>` : ''}

  const wasHidden = root.hidden;
  root.hidden = false;
  overlay.key = key; overlay.reopen = reopen;
  document.body.classList.add('locked');
  if (again) $('.panel-body', root).scrollTop = scroll;
  if (wasHidden) { root.classList.remove('show'); requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('show'))); }
  else root.classList.add('show');

}

function toast(msg, tone = 'ok') {
  const el = document.createElement('div');

  $$('#toasts .toast').slice(0, -1).forEach(t => t.remove()); // keep at most two on screen
  $('#toasts').appendChild(el);

}

/* ---------- form helpers ---------- */
function field(name, label, control, { hint = '', group = false, cls = '' } = {}) {

/* Shows Persian per-field errors; returns true when the form is valid. */
function validate(form, rules) {
  const errs = {};
  for (const [name, check] of Object.entries(rules)) {
    const el = form.elements[name], v = el ? String(el.value ?? '').trim() : '';
    const msg = check(v);
    if (msg) errs[name] = msg;
  }
  $$('.field', form).forEach(f => {
    const msg = errs[f.dataset.field];
    f.classList.toggle('has-error', !!msg);
    const p = $('.field-error', f);
    if (p) p.innerHTML = msg ? `${icon('alert')}${msg}` : '';
  });
  const first = Object.keys(errs)[0];
  if (first) {
    const el = form.elements[first];
    (el && el.focus ? el : $(`[data-field="${first}"] input`, form))?.focus();
  }
  return !first;
}

  const list = myCases().slice().sort((a, b) => b.updated - a.updated);

    <div class="card-head"><h2>وضعیت درخواست‌های من</h2><a class="link" href="#/desk">همه${icon('chevLeft')}</a></div>
    <p class="myreq-sum">${fa(open)} پرونده باز${answered ? ` · <b>${fa(answered)} پاسخ تازه</b>` : ''}</p>
    <ul class="req-list">${list.slice(0, 4).map(c => `<li><button class="req" data-action="open" data-id="${c.id}">
      ${iconTile(CASE_CATS[c.cat].icon, CASE_CATS[c.cat].tone, 'sm')}

    <button class="btn btn-soft btn-block" data-action="quick" data-i="2">${icon('plus')}ثبت درخواست تازه</button>

}

PAGES.dashboard = {
  title: 'داشبورد',
  render: () => `<div class="dash">
      <div class="dash-main">${heroHTML()}${statsHTML()}<div class="dash-lists">${dashEventsHTML()}${dashNeedsHTML()}${dashExportHTML()}</div></div>
      <aside class="dash-side">${quickHTML()}${myRequestsHTML()}</aside>
    </div>`,
  after: startSlides
};

let slideTimer = null;
function setSlide(i) {
  ui.slide = (i + SLIDES.length) % SLIDES.length;
  $$('.hero .slide').forEach((el, k) => {
    const on = k === ui.slide;
    el.classList.toggle('on', on);
    el.setAttribute('aria-hidden', String(!on));
    const b = $('.btn-hero', el);
    if (b) b.tabIndex = on ? 0 : -1;
  });
  $$('.hero .dot').forEach((el, k) => { el.classList.toggle('on', k === ui.slide); el.setAttribute('aria-pressed', String(k === ui.slide)); });
}
function startSlides() {
  clearInterval(slideTimer);
  slideTimer = setInterval(() => {
    const hero = $('.hero');
    if (!hero) return clearInterval(slideTimer);
    if (!hero.matches(':hover') && !hero.contains(document.activeElement) && !document.hidden) setSlide(ui.slide + 1);
  }, 6500);
}

ACTIONS.slide = el => { setSlide(+el.dataset.i); startSlides(); };
ACTIONS.stat = el => {
  const s = statItems()[+el.dataset.i];
  if (s.page) return go(s.page);
  Object.assign(ui.needs, { q: '', mine: false }, s.filter);
  go('needs');
};
ACTIONS.quick = el => {
  const q = QUICK[+el.dataset.i];
  return q.open ? openItem(q.open) : go(q.page);
};

  <script>
/* Page 2 — needs and opportunities, with simple rule-based matching. */

const toLatin = s => String(s ?? '').replace(/[۰-۹]/g, d => FA_DIGITS.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٬\s]/g, '');
const UNIT_OPTIONS = ['تن در ماه', 'هزار عدد در ماه', 'نفر', 'میلیارد تومان'];
const UNIT_BY_CAT = { material: 'تن در ماه', workforce: 'نفر', investment: 'میلیارد تومان', service: 'تن در ماه' };

function filteredNeeds() {
  const f = ui.needs, q = norm(f.q);
  return state.needs
    .filter(x => (f.cat === 'all' || x.cat === f.cat) && (f.kind === 'all' || x.kind === f.kind) && (!f.mine || x.company === ME) &&
      (!q || norm(x.title + companyOf(x).name + x.desc + x.tags.join('')).includes(q)))

}

function needCard(x) {
  const c = companyOf(x), m = matchesFor(x).length;
  return `<article class="ncard card" data-action="open" data-id="${x.id}" tabindex="0" role="button" aria-label="${esc(x.title)}">
    <div class="ncard-top">${catChip(NEED_CATS, x.cat)}${kindBadge(x.kind)}${x.company === ME ? '<span class="badge-mine">ثبت شما</span>' : ''}${newBadge(x.created)}</div>
    <h3>${esc(x.title)}</h3>
    <div class="meta"><span>${icon('building')}${esc(c.name)}</span><span>${icon('pin')}${esc(c.city)}</span></div>
    ${x.amount ? `<div class="ncard-amount">${x.kind === 'need' ? 'مقدار نیاز' : 'ظرفیت'}: <b>${faNum(x.amount)} ${x.unit}</b></div>` : ''}
    <div class="ncard-foot"><span class="muted">${timeAgo(x.created)}</span>${m ? `<span class="match-hint">${icon('sparkles')}${fa(m)} پیشنهاد مرتبط</span>` : ''}</div>
  </article>`;
}

PAGES.needs = {
  title: 'نیازمندی‌ها و فرصت‌ها',
  results() {
    const list = filteredNeeds();
    return `<p class="result-count">${fa(list.length)} مورد</p>` + (list.length
      ? `<div class="ngrid">${list.map(needCard).join('')}</div>`
      : `<div class="card">${emptyState('موردی با این فیلترها پیدا نشد.', '<button class="btn btn-ghost btn-sm" data-action="nf-clear">پاک کردن فیلترها</button>')}</div>`);
  },
  render() {
    const f = ui.needs, base = state.needs.filter(x => (f.kind === 'all' || x.kind === f.kind) && (!f.mine || x.company === ME));
    const cats = [['all', 'همه دسته‌ها', base.length], ...Object.entries(NEED_CATS).map(([k, v]) => [k, v.label, base.filter(x => x.cat === k).length])];
    return pageHead('نیازمندی‌ها و فرصت‌های صنعتی', 'نیازهای ثبت‌شده شرکت‌ها و فرصت‌های همکاری را ببینید، نیاز خود را ثبت کنید و پیشنهادهای مرتبط را همراه با دلیل تطبیق بگیرید.',
      `<button class="btn btn-ghost" data-action="new-need" data-kind="offer">${icon('handshake')}ثبت فرصت همکاری</button><button class="btn btn-primary" data-action="new-need" data-kind="need">${icon('plus')}ثبت نیاز جدید</button>`) +
      `<div class="toolbar">
        <label class="tsearch">${icon('search')}<input id="needs-q" type="search" placeholder="جست‌وجو در عنوان، شرکت یا توضیح…" value="${esc(f.q)}" data-filter="needs.q" aria-label="جست‌وجو در نیازها"></label>
        <div class="segbar" role="group" aria-label="نوع">${[['all', 'همه'], ['need', 'نیازها'], ['offer', 'عرضه و فرصت‌ها']].map(([k, l]) => `<button class="${f.kind === k ? 'on' : ''}" data-action="nf" data-key="kind" data-val="${k}" aria-pressed="${f.kind === k}">${l}</button>`).join('')}</div>
        ${chip(`${icon('user')}ثبت‌شده‌های من`, f.mine, 'nf', `data-key="mine" data-val="${!f.mine}"`)}
      </div>
      <div class="fchips cat-chips">${cats.map(([k, l, n]) => chip(l, f.cat === k, 'nf', `data-key="cat" data-val="${k}"`, n)).join('')}</div>
      <div id="results">${this.results()}</div>`;
  },
  after() {
    if (!ui.flash) return;
    const el = $(`.ncard[data-id="${ui.flash}"]`);
    ui.flash = null;
    if (el) { el.classList.add('flash'); el.scrollIntoView({ block: 'center' }); }
  }
};

ACTIONS.nf = el => {
  const k = el.dataset.key;
  ui.needs[k] = k === 'mine' ? el.dataset.val === 'true' : el.dataset.val;
  rerender();
};
ACTIONS['nf-clear'] = () => { Object.assign(ui.needs, { q: '', cat: 'all', kind: 'all', mine: false }); rerender(); };
ACTIONS['new-need'] = el => openNeedForm(el.dataset.kind);
ACTIONS['see-need'] = el => {
  Object.assign(ui.needs, { q: '', cat: 'all', kind: 'all', mine: false });
  ui.flash = el.dataset.id;
  if (ui.page === 'needs') { closeOverlay(); rerender(); PAGES.needs.after(); } else go('needs');
};
ACTIONS.connect = el => {
  state.contacts[el.dataset.id] = Date.now();
  save();
  toast('درخواست ارتباط ثبت شد؛ پس از تأیید طرف مقابل، اطلاعات تماس نمایش داده می‌شود (نمایشی).');
  refreshOverlay();
};

function matchesHTML(x, ms) {
  const head = `<div class="sec-title">${icon('sparkles')}پیشنهادهای مرتبط ${demoTag('تطبیق با قواعد ساده')}</div>`;
  if (!ms.length) return head + '<p class="muted">فعلاً مورد هم‌خوانی پیدا نشد؛ با ثبت موارد تازه، پیشنهادها به‌روز می‌شوند.</p>';
  return head + `<div class="matches">${ms.map(m => {
    const [lvl, t] = matchLevel(m.score), o = companyOf(m.item);
    return `<div class="match">
      <div class="match-score ${toneCls(t)}" style="--p:${m.score}"><b>${fa(m.score)}٪</b><small>${lvl}</small></div>
      <div class="match-main">
        <div class="match-title"><strong>${esc(m.item.title)}</strong>${kindBadge(m.item.kind)}</div>
        <div class="meta"><span>${icon('building')}${esc(o.name)}</span><span>${icon('pin')}${esc(o.city)}</span></div>
        <ul class="reasons">${m.reasons.map(r => `<li>${icon('check')}<span>${esc(r)}</span></li>`).join('')}</ul>
      </div>
      <button class="btn btn-ghost btn-sm" data-action="open" data-id="${m.item.id}">مشاهده</button>
    </div>`;
  }).join('')}</div>`;
}

function openNeed(id) {
  const x = findNeed(id);
  if (!x) return toast('این مورد پیدا نشد.', 'warn');
  const c = companyOf(x), mine = x.company === ME, sent = state.contacts[x.id];
  const contactBtn = sent
    ? `<button class="btn btn-done" disabled>${icon('check')}درخواست ارتباط ارسال شد</button>`
    : `<button class="btn btn-primary" data-action="connect" data-id="${x.id}">${icon('send')}درخواست ارتباط با ${x.kind === 'need' ? 'متقاضی' : 'عرضه‌کننده'}</button>`;
  openPanel({
    size: 'lg', key: 'need:' + id, reopen: () => openNeed(id), title: x.title,
    sub: `${catChip(NEED_CATS, x.cat)}${kindBadge(x.kind)}${mine ? '<span class="badge-mine">ثبت شما</span>' : ''}${code(x.id)}`,
    body: `<div class="kv">
        <div><div class="k">شرکت</div><div class="v">${esc(c.name)}</div></div>
        <div><div class="k">محل</div><div class="v">${esc(c.park || c.city)}</div></div>
        ${x.amount ? `<div><div class="k">${x.kind === 'need' ? 'مقدار نیاز' : 'ظرفیت اعلام‌شده'}</div><div class="v">${faNum(x.amount)} ${x.unit}</div></div>` : ''}
        <div><div class="k">${x.deadline ? 'مهلت پاسخ' : 'تاریخ ثبت'}</div><div class="v">${x.deadline ? `<bdi>${jDate(x.deadline)}</bdi> · <bdi>${until(x.deadline)}</bdi>` : jDate(x.created)}</div></div>
      </div>
      <div class="sec"><div class="sec-title">${icon('note')}توضیحات</div><p class="prose">${esc(x.desc)}</p>

      ${mine ? '' : `<div class="notice tone-gray sec">${icon('lock')}<span>اطلاعات تماس پس از تأیید طرف مقابل نمایش داده می‌شود. در این دمو، درخواست ارتباط فقط به‌صورت نمایشی ثبت می‌شود.</span></div>`}`,
    footer: (mine ? '' : contactBtn) + '<button class="btn btn-ghost" data-action="close">بستن</button>'

function openNeedForm(kind = 'need') {
  const cat = ui.needs.cat !== 'all' ? ui.needs.cat : '';
  openPanel({
    size: 'md', key: 'need-form',
    title: kind === 'need' ? 'ثبت نیاز جدید' : 'ثبت فرصت همکاری',
    sub: `<span>ثبت به نام ${esc(COMPANIES[ME].name)} · ${esc(COMPANIES[ME].city)}</span>`,
    body: `<form id="needForm" class="form-grid" data-form="need" novalidate>
      ${field('kind', 'نوع ثبت', segmented('kind', [['need', 'به این نیاز دارم', 'search'], ['offer', 'این را عرضه می‌کنم', 'handshake']], kind), { group: true, cls: 'full' })}
      ${field('cat', 'دسته', tilePicker('cat', Object.entries(NEED_CATS).map(([k, v]) => [k, v.label, v.icon, v.tone]), cat), { group: true, cls: 'full' })}
      ${field('title', 'عنوان', textInput('title', 'maxlength="80" placeholder="مثلاً: ورق فولادی St37 ضخامت ۵ میلی‌متر" autocomplete="off"'), { cls: 'full' })}
      ${field('amount', 'مقدار یا ظرفیت (اختیاری)', `<div class="inline-row">${textInput('amount', 'inputmode="decimal" placeholder="مثلاً ۴۰" autocomplete="off"')}${selectBox('unit', UNIT_OPTIONS.map(u => [u, u]), UNIT_BY_CAT[cat] || UNIT_OPTIONS[0])}</div>`)}
      ${field('deadline', 'مهلت پاسخ', selectBox('deadline', [['7', 'یک هفته'], ['14', 'دو هفته'], ['30', 'یک ماه'], ['90', 'سه ماه']], '30'))}
      ${field('desc', 'توضیحات', textArea('desc', 'rows="3" maxlength="400" placeholder="مشخصات، شرایط تحویل یا همکاری، و هر نکته‌ای که به تطبیق دقیق‌تر کمک می‌کند."'), { cls: 'full' })}
      <div class="full"><div class="tags-live" id="needTags"><span>کلیدواژه‌های شناسایی‌شده برای تطبیق، اینجا نمایش داده می‌شوند.</span></div></div>
    </form>`,
    footer: `<button class="btn btn-primary" type="submit" form="needForm">${icon('check')}ثبت و دیدن پیشنهادها</button><button class="btn btn-ghost" data-action="close">انصراف</button>`
  });
}

FORMS.needInput = (form, el) => {
  if (el.name === 'cat') form.elements.unit.value = UNIT_BY_CAT[el.value];
  if (el.name === 'title' || el.name === 'desc') {
    const tags = extractTags(`${form.elements.title.value} ${form.elements.desc.value}`);
    $('#needTags').innerHTML = tags.length
      ? `<span>کلیدواژه‌ها:</span>${tags.map(t => `<span class="tag hit">${esc(t)}</span>`).join('')}`
      : '<span>کلیدواژه‌های شناسایی‌شده برای تطبیق، اینجا نمایش داده می‌شوند.</span>';
  }
};

FORMS.need = form => {
  const ok = validate(form, {
    cat: required('دسته را انتخاب کنید.'),
    title: v => (!v ? 'عنوان را بنویسید.' : v.length < 5 ? 'عنوان کوتاه است؛ دست‌کم ۵ حرف بنویسید.' : ''),
    amount: v => (v && !(+toLatin(v) > 0) ? 'مقدار را فقط به عدد بنویسید؛ مثلاً ۴۰.' : ''),
    desc: v => (!v ? 'یک توضیح کوتاه بنویسید تا تطبیق دقیق‌تر شود.' : v.length < 15 ? 'توضیح را کمی کامل‌تر بنویسید (دست‌کم ۱۵ حرف).' : '')
  });
  if (!ok) return;
  const d = Object.fromEntries(new FormData(form)), now = Date.now(), amount = d.amount ? +toLatin(d.amount) : undefined;
  const item = {
    id: d.kind === 'need' ? `N-${++state.seq.need}` : `O-${++state.seq.offer}`, kind: d.kind, cat: d.cat, company: ME,
    title: d.title.trim(), desc: d.desc.trim(), amount, unit: amount ? d.unit : undefined,
    tags: extractTags(`${d.title} ${d.desc}`), created: now, deadline: now + (+d.deadline) * DAY
  };
  state.needs.unshift(item);
  const ms = matchesFor(item);
  if (ms.length) notify('company', { icon: 'sparkles', tone: 'green', text: `برای «${item.title}» ${fa(ms.length)} پیشنهاد مرتبط پیدا شد.`, link: { page: 'needs', open: item.id } });
  save();
  rerender();
  openPanel({
    size: 'lg', key: 'need-ok:' + item.id, title: item.kind === 'need' ? 'نیاز شما ثبت شد' : 'فرصت همکاری ثبت شد',
    body: `<div class="success-hero"><span class="ok">${icon('check')}</span><h3>«${esc(item.title)}» منتشر شد</h3>
        <p>کد پیگیری ${code(item.id)} · در فهرست نیازها و داشبورد نمایش داده می‌شود.</p></div>
      <div class="sec">${matchesHTML(item, ms)}</div>`,
    footer: `<button class="btn btn-primary" data-action="see-need" data-id="${item.id}">مشاهده در فهرست</button><button class="btn btn-ghost" data-action="close">بستن</button>`
  });
  toast('ثبت شد و در فهرست قرار گرفت.');
};

  <script>
/* Page 3 — market development and export. Market notes, scores and checklists are hypothetical. */

const CERTS = [['iso', 'ISO 9001'], ['inso', 'استاندارد ملی ایران'], ['haccp', 'HACCP / ایمنی غذا'], ['halal', 'گواهی حلال'], ['ce', 'CE']];

function filteredProducts() {
  const f = ui.export, q = norm(f.q);
  return state.products
    .filter(p => (f.market === 'all' || p.markets.includes(f.market)) && (f.cat === 'all' || p.cat === f.cat) && (!q || norm(p.name + companyOf(p).name + p.desc).includes(q)))
    .sort((a, b) => b.created - a.created);
}

function ring(score, size = '') {
  const r = 26, c = 2 * Math.PI * r, tone = score >= 75 ? 'green' : score >= 50 ? 'amber' : 'red';
  return `<span class="ring ${size} ${toneCls(tone)}" role="img" aria-label="امتیاز ${fa(score)} از ۱۰۰"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" class="ring-bg"/><circle cx="32" cy="32" r="${r}" class="ring-fg" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - score / 100)).toFixed(1)}"/></svg><b>${fa(score)}</b></span>`;
}
const stars = n => `<span class="stars" aria-label="${fa(n)} از ۵">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? 'on' : ''}">${icon('star')}</i>`).join('')}</span>`;

function productCard(p) {
  const cat = PRODUCT_CATS[p.cat];
  return `<article class="pcard card" data-action="open" data-id="${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)}">
    <div class="pcard-img ${toneCls(cat.tone)}">${icon(cat.icon)}<span class="flags">${p.markets.map(m => flag(m, 'sm')).join('')}</span>${newBadge(p.created)}</div>
    <div class="pcard-body">
      <span class="pcard-cat">${cat.label}${p.company === ME ? ' · <b>محصول شما</b>' : ''}</span>
      <h3>${esc(p.name)}</h3>
      <div class="meta"><span>${icon('building')}${esc(companyOf(p).name)}</span></div>
      <div class="meta"><span>${icon('factory')}ظرفیت: ${esc(p.capacity)}</span></div>
      <div class="std">${p.standards.slice(0, 2).map(s => `<span class="tag">${esc(s)}</span>`).join('')}${p.standards.length > 2 ? `<span class="tag">+${fa(p.standards.length - 2)}</span>` : ''}</div>
    </div>
  </article>`;
}

function marketsHTML() {
  const f = ui.export;
  const all = `<button class="mcard ${f.market === 'all' ? 'on' : ''}" data-action="xf" data-key="market" data-val="all" aria-pressed="${f.market === 'all'}"><span class="mcard-ico">${icon('globe')}</span><strong>همه بازارها</strong><small>${fa(state.products.length)} محصول</small></button>`;
  return `<div class="markets">${all}${Object.entries(DEMO_MARKETS).map(([k, m]) => `<button class="mcard ${f.market === k ? 'on' : ''}" data-action="xf" data-key="market" data-val="${k}" aria-pressed="${f.market === k}">${flag(k, 'lg')}<strong>${m.name}</strong><small>${fa(state.products.filter(p => p.markets.includes(k)).length)} محصول · ${m.route}</small></button>`).join('')}</div>`;

function marketBrief(k) {
  const m = DEMO_MARKETS[k];
  return `<section class="card brief">
    <div class="brief-head">${flag(k, 'lg')}<div class="brief-title"><h2>بازار ${m.name}</h2>${demoTag('برداشت نمونه؛ نیازمند اعتبارسنجی کارشناسی')}</div>
      <button class="btn btn-primary btn-sm" data-action="assess" data-market="${k}">${icon('gauge')}ارزیابی آمادگی برای ${m.name}</button></div>
    <div class="kv kv-3">
      <div><div class="k">مسیر حمل پیشنهادی</div><div class="v">${m.route}</div></div>
      <div><div class="k">زمینه‌های پرتقاضا (نمونه)</div><div class="v">${m.demand}</div></div>
      <div><div class="k">جذابیت اولیه (نمایشی)</div><div class="v">${stars(m.stars)}</div></div>
    </div>
    <p class="brief-note">${icon('info')}<span>${m.note}.</span></p>
  </section>`;
}

function assessCardHTML() {
  const a = state.assessments[0];
  return `<section class="card assess-card">
    <span class="assess-ill">${icon('gauge')}</span>
    <h2>ارزیابی اولیه آمادگی صادرات</h2>

ACTIONS.xf = el => { ui.export[el.dataset.key] = el.dataset.val; rerender(); };

function openProduct(id) {
  const p = findProduct(id);
  if (!p) return toast('این محصول پیدا نشد.', 'warn');
  const c = companyOf(p), mine = p.company === ME, cat = PRODUCT_CATS[p.cat], sent = state.contacts[p.id];
  const specs = [['کد تعرفه (نمونه)', `<bdi dir="ltr">${p.hs}</bdi>`], ['ظرفیت عرضه', esc(p.capacity)], ['حداقل سفارش', esc(p.moq)], ...p.specs.map(([k, v]) => [esc(k), esc(v)])];
  const contact = mine || sent
    ? `<div class="kv"><div><div class="k">واحد</div><div class="v">${p.contact.unit}</div></div><div><div class="k">تلفن (نمونه)</div><div class="v"><bdi dir="ltr">${p.contact.phone}</bdi></div></div><div><div class="k">ایمیل (نمونه)</div><div class="v"><bdi dir="ltr">${p.contact.email}</bdi></div></div></div>`
    : `<div class="notice tone-gray">${icon('lock')}<span>اطلاعات تماس با اجازه شرکت و پس از ثبت «درخواست ارتباط» نمایش داده می‌شود (نمایشی).</span></div>`;

    size: 'lg', key: 'product:' + id, reopen: () => openProduct(id), title: p.name,
    sub: `${catChip(PRODUCT_CATS, p.cat)}${mine ? '<span class="badge-mine">محصول شما</span>' : ''}<span>${esc(c.name)} · ${esc(c.city)}</span>`,
    body: `<div class="prod-hero ${toneCls(cat.tone)}">${iconTile(cat.icon, cat.tone, 'lg')}<div><p class="prose">${esc(p.desc)}</p>
        <div class="mk-row">${p.markets.map(m => `<span class="mk">${flag(m, 'sm')}${DEMO_MARKETS[m].name}</span>`).join('')}</div></div></div>
      <div class="sec"><div class="sec-title">${icon('listCheck')}مشخصات و ظرفیت عرضه</div>
        <table class="spec"><tbody>${specs.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</tbody></table></div>
      <div class="sec"><div class="sec-title">${icon('award')}استانداردهای ثبت‌شده</div>
        <div class="std">${p.standards.map(s => `<span class="tag hit">${icon('shield')}${esc(s)}</span>`).join('')}</div>
        <p class="small-note">اعلام‌شده توسط شرکت؛ اصالت گواهی‌ها در نسخه عملیاتی بررسی می‌شود.</p></div>
      <div class="sec"><div class="sec-title">${icon('phone')}اطلاعات تماس مجاز</div>${contact}</div>`,

      ? `<button class="btn btn-primary" data-action="assess" data-product="${p.id}">${icon('gauge')}ارزیابی آمادگی صادرات این محصول</button>`
      : sent ? `<button class="btn btn-done" disabled>${icon('check')}درخواست ارتباط ثبت شد</button>`
        : `<button class="btn btn-primary" data-action="connect" data-id="${p.id}">${icon('send')}درخواست ارتباط با تأمین‌کننده</button>`) +
      '<button class="btn btn-ghost" data-action="close">بستن</button>'
  });
}

function openAssessmentForm(preset = {}) {
  const mine = state.products.filter(p => p.company === ME);
  const market = preset.market || (ui.export.market !== 'all' ? ui.export.market : '');
  openPanel({
    size: 'md', key: 'assess-form', title: 'ارزیابی اولیه آمادگی صادرات',
    sub: `<span class="label-warn sm">${icon('alert')}ارزیابی اولیه؛ نیازمند تأیید کارشناسی</span>`,
    body: `<form id="assessForm" class="form-grid" data-form="assess" novalidate>
      ${field('product', 'محصول', selectBox('product', [['', 'انتخاب کنید…'], ...mine.map(p => [p.id, p.name]), ['other', 'محصول دیگر (عمومی)']], preset.product || (mine[0] ? mine[0].id : '')), { cls: 'full' })}
      ${field('market', 'بازار هدف', `<div class="market-pick" role="radiogroup" aria-labelledby="l-market">${Object.entries(DEMO_MARKETS).map(([k, m]) => `<label class="mp-opt"><input type="radio" name="market" value="${k}" ${k === market ? 'checked' : ''}><span>${flag(k, 'md')}${m.name}</span></label>`).join('')}</div>`, { group: true, cls: 'full' })}
      ${field('share', 'سهم ظرفیت قابل اختصاص به صادرات', segmented('share', [['low', 'کمتر از ۱۰٪'], ['mid', '۱۰ تا ۳۰٪'], ['high', 'بیش از ۳۰٪']], ''), { group: true, cls: 'full' })}
      ${field('exp', 'سابقه صادرات', segmented('exp', [['none', 'ندارد'], ['some', 'کمتر از ۲ سال'], ['long', 'بیش از ۲ سال']], ''), { group: true, cls: 'full' })}
      ${field('certs', 'گواهی‌ها و استانداردهای فعلی', `<div class="checks">${CERTS.map(([k, l]) => `<label class="check"><input type="checkbox" name="certs" value="${k}">${l}</label>`).join('')}</div>`, { group: true, cls: 'full', hint: 'اگر هیچ‌کدام را ندارید، خالی بگذارید.' })}
      ${field('pack', 'بسته‌بندی صادراتی', segmented('pack', [['yes', 'آماده است'], ['wip', 'در حال آماده‌سازی'], ['no', 'ندارد']], ''), { group: true, cls: 'full' })}
      ${field('label', 'برچسب عربی یا انگلیسی', segmented('label', [['yes', 'دارد'], ['no', 'ندارد']], ''), { group: true })}
      ${field('price', 'قیمت صادراتی (FOB/CIF)', segmented('price', [['yes', 'آماده است'], ['no', 'هنوز نه']], ''), { group: true })}
      ${field('card', 'کارت بازرگانی', segmented('card', [['yes', 'دارد'], ['partner', 'از طریق شریک'], ['no', 'ندارد']], ''), { group: true, cls: 'full' })}
    </form>`,
    footer: `<button class="btn btn-primary" type="submit" form="assessForm">${icon('gauge')}محاسبه نتیجه</button><button class="btn btn-ghost" data-action="close">انصراف</button>`
  });
}

FORMS.assess = form => {
  const pick = required('یکی از گزینه‌ها را انتخاب کنید.');
  const ok = validate(form, { product: required('محصول را انتخاب کنید.'), market: required('بازار هدف را انتخاب کنید.'), share: pick, exp: pick, pack: pick, label: pick, price: pick, card: pick });
  if (!ok) return;
  const d = Object.fromEntries(new FormData(form)), certs = new FormData(form).getAll('certs');
  const product = findProduct(d.product), food = product && product.cat === 'food', mk = DEMO_MARKETS[d.market].name;
  const pts = { share: { low: 4, mid: 9, high: 12 }, exp: { none: 0, some: 9, long: 16 }, pack: { yes: 14, wip: 7, no: 0 }, label: { yes: 10, no: 0 }, card: { yes: 10, partner: 6, no: 0 }, price: { yes: 10, no: 0 } };
  const score = Math.min(100, Object.keys(pts).reduce((t, k) => t + pts[k][d[k]], 0) + Math.min(28, certs.length * 7));

  const strengths = [];
  if (d.pack === 'yes') strengths.push('بسته‌بندی صادراتی آماده است');
  if (d.label === 'yes') strengths.push('برچسب عربی یا انگلیسی دارد');
  if (d.price === 'yes') strengths.push('قیمت صادراتی آماده است');
  if (d.card !== 'no') strengths.push(d.card === 'yes' ? 'کارت بازرگانی دارد' : 'از طریق شریک تجاری امکان صادرات دارد');
  if (d.exp !== 'none') strengths.push('سابقه صادرات دارد');
  if (certs.length) strengths.push(`گواهی‌ها: ${CERTS.filter(([k]) => certs.includes(k)).map(([, l]) => l).join('، ')}`);

  const items = [];
  if (d.pack !== 'yes') items.push('آماده‌سازی بسته‌بندی مقاوم برای حمل طولانی و دمای بالای منطقه');
  if (d.label !== 'yes') items.push(`طراحی برچسب دوزبانه عربی/انگلیسی؛ الزامات دقیق بازار ${mk} بررسی شود`);
  if (d.card === 'no') items.push('دریافت کارت بازرگانی یا همکاری با یک شرکت بازرگانی دارای کارت');
  if (!certs.includes('iso')) items.push('استقرار سیستم مدیریت کیفیت (مانند ISO 9001)');
  if (food && !certs.includes('halal')) items.push('اخذ گواهی حلال و گواهی‌های بهداشتی مورد نیاز مقصد');
  if (food && !certs.includes('haccp')) items.push('استقرار HACCP یا سیستم ایمنی مواد غذایی');
  if (d.price !== 'yes') items.push('تهیه فهرست قیمت صادراتی بر پایه FOB یا CIF');
  if (d.exp === 'none') items.push('شرکت در «کارگاه الزامات صادرات» در بخش آموزش و رویدادها');
  items.push(d.market === 'iq' ? 'بررسی مدارک گواهی مبدأ و الزامات بازرسی کالا برای بازار عراق' : `بررسی الزامات ثبت محصول و برچسب‌گذاری در ${mk}`);
  items.push('یافتن خریدار یا نماینده آزمایشی و ارسال نمونه محصول');
  items.push('هماهنگی با کارشناس توسعه صادرات برای تأیید نتیجه');

  const now = Date.now();
  state.assessments.unshift({
    id: 'A-' + now, at: now, product: d.product, productName: product ? product.name : 'محصول عمومی', market: d.market, score,
    level: score >= 75 ? 'آمادگی خوب' : score >= 50 ? 'آمادگی متوسط' : 'نیازمند آماده‌سازی', strengths, items, done: items.map(() => false), caseId: null
  });
  state.assessments.length = Math.min(state.assessments.length, 5);
  save();
  rerender();
  openAssessmentResult();
};

function openAssessmentResult() {
  const a = state.assessments[0];
  if (!a) return openAssessmentForm();
  const done = a.done.filter(Boolean).length;
  openPanel({
    size: 'md', key: 'assess-result:' + a.id, reopen: openAssessmentResult, title: 'نتیجه ارزیابی اولیه',
    sub: `<span>${esc(a.productName)}</span><span class="mk">${flag(a.market, 'sm')}${DEMO_MARKETS[a.market].name}</span>`,
    body: `<p class="label-warn big">${icon('alert')}ارزیابی اولیه؛ نیازمند تأیید کارشناسی</p>
      <div class="result-top">${ring(a.score, 'lg')}<div><h3>${a.level}</h3><p class="muted">امتیاز ${fa(a.score)} از ۱۰۰، محاسبه‌شده از پاسخ‌های شما با قواعد ساده نمایشی؛ این عدد نظر رسمی یا تأییدشده نیست.</p></div></div>
      ${a.strengths.length ? `<div class="sec"><div class="sec-title">${icon('checkCircle')}نقاط قوت</div><ul class="bullets">${a.strengths.map(s => `<li>${icon('check')}<span>${esc(s)}</span></li>`).join('')}</ul></div>` : ''}
      <div class="sec"><div class="sec-title">${icon('listCheck')}چک‌لیست پیشنهادی اقدامات<span class="sec-count">${fa(done)} از ${fa(a.items.length)}</span></div>
        <div class="progress"><i style="width:${Math.round(done / a.items.length * 100)}%"></i></div>
        <ul class="checklist">${a.items.map((t, i) => `<li><label class="cl-item ${a.done[i] ? 'done' : ''}"><input type="checkbox" data-change="tick" data-i="${i}" ${a.done[i] ? 'checked' : ''}><span>${esc(t)}</span></label></li>`).join('')}</ul></div>`,
    footer: (a.caseId
      ? `<button class="btn btn-done" disabled>${icon('check')}ارسال شد: ${code(a.caseId)}</button>`
      : `<button class="btn btn-primary" data-action="assess-send">${icon('send')}ارسال برای بررسی کارشناس</button>`) +
      `<button class="btn btn-ghost" data-action="assess" data-product="${a.product === 'other' ? '' : a.product}" data-market="${a.market}">ارزیابی دوباره</button>`
  });
}

ACTIONS.tick = el => {
  const a = state.assessments[0];
  if (!a) return;
  a.done[+el.dataset.i] = el.checked;
  save();
  rerender();
};
ACTIONS['assess-send'] = () => {
  const a = state.assessments[0];
  if (!a || a.caseId) return;
  const c = createCase({ cat: 'export', priority: 'medium', title: `بررسی ارزیابی صادرات «${a.productName}» به ${DEMO_MARKETS[a.market].name}`, desc: `امتیاز اولیه ${fa(a.score)} از ۱۰۰ (${a.level}) با ${fa(a.items.length)} اقدام پیشنهادی. لطفاً نتیجه بررسی و تأیید شود.` });
  c.assignee = UNIT_FOR.export;
  a.caseId = c.id;
  save();
  rerender();
  toast(`برای کارشناس ارسال شد؛ کد پیگیری ${c.id}`);
};

</script>
  <script>
/* Page 4 — service desk (company view) and Page 5 — expert panel (expert view).
   Both work on the same state.cases, so a change on one side shows up on the other. */

const caseCount = (list, s) => list.filter(c => c.status === s).length;

function caseRow(c, expert) {
  const cat = CASE_CATS[c.cat];
  return `<tr class="row" data-action="open" data-id="${c.id}" tabindex="0">
    <td><div class="t-title">${iconTile(cat.icon, cat.tone, 'sm')}<div><strong>${esc(c.title)}</strong><small>${code(c.id)} · ${expert ? esc(companyOf(c).name) : cat.label}</small></div></div></td>
    ${expert ? `<td data-label="نوع">${catChip(CASE_CATS, c.cat)}</td>` : ''}
    <td data-label="تاریخ ثبت">${jDate(c.created)}</td>
    <td data-label="مسئول">${esc(c.assignee)}</td>
    <td data-label="اولویت">${prioPill(c.priority)}</td>
    <td data-label="وضعیت">${statusPill(c.status)}</td>
    <td class="t-go">${icon('chevLeft')}</td>
  </tr>`;
}
function caseTable(list, expert) {
  return `<div class="card table-card"><div class="table-wrap"><table class="tbl stack">
    <thead><tr><th>عنوان پرونده</th>${expert ? '<th>نوع درخواست</th>' : ''}<th>تاریخ ثبت</th><th>مسئول</th><th>اولویت</th><th>وضعیت</th><th></th></tr></thead>
    <tbody>${list.map(c => caseRow(c, expert)).join('')}</tbody></table></div></div>`;
}

function historyHTML(c, withNotes) {
  const items = c.history.map(h => ({ ...h, type: 'h' }));
  if (withNotes) items.push(...c.notes.map(n => ({ ...n, type: 'n' })));
  items.sort((a, b) => a.at - b.at);
  return `<ol class="timeline">${items.map(h => h.type === 'n'
    ? `<li class="tl-note"><span class="tl-dot">${icon('lock')}</span><div><div class="tl-head"><strong>یادداشت داخلی</strong><span>${esc(h.by)} · ${jDate(h.at)} ${jTime(h.at)}</span></div><p>${esc(h.text)}</p></div></li>`
    : `<li class="${h.kind === 'message' ? 'tl-msg' : ''}"><span class="tl-dot ${h.kind === 'status' ? toneCls(STATUS[h.status].tone) : 'tone-gray'}">${icon(h.kind === 'message' ? 'message' : h.kind === 'assign' ? 'user' : 'check')}</span>
        <div><div class="tl-head"><strong>${h.kind === 'status' ? STATUS[h.status].label : h.kind === 'assign' ? 'تغییر مسئول' : 'پیام'}</strong><span>${esc(h.by)} · ${jDate(h.at)} ${jTime(h.at)}</span></div>${h.text ? `<p>${esc(h.text)}</p>` : ''}</div></li>`).join('')}</ol>`;
}

function caseInfo(c) {
  return `<div class="sec">${stepper(c.status)}</div>
    <div class="kv sec">
      <div><div class="k">نوع درخواست</div><div class="v">${CASE_CATS[c.cat].label}</div></div>
      <div><div class="k">اولویت</div><div class="v">${prioPill(c.priority)}</div></div>
      <div><div class="k">تاریخ ثبت</div><div class="v"><bdi>${jDate(c.created)}</bdi> · <bdi>${timeAgo(c.created)}</bdi></div></div>
      <div><div class="k">مسئول پیگیری</div><div class="v">${esc(c.assignee)}</div></div>
      <div><div class="k">شرکت</div><div class="v">${esc(companyOf(c).name)}</div></div>
      <div><div class="k">محل</div><div class="v">${esc(c.location)}</div></div>
    </div>
    <div class="sec"><div class="sec-title">${icon('note')}شرح مشکل</div><p class="prose">${esc(c.desc)}</p>${c.note ? `<p class="prose muted">توضیحات تکمیلی: ${esc(c.note)}</p>` : ''}</div>`;
}

/* ---------- Page 4: company service desk ---------- */
PAGES.desk = {
  title: 'میز خدمت و پیگیری مشکلات',
  results() {
    const f = ui.desk, q = norm(f.q);
    const list = myCases().filter(c => (f.status === 'all' || c.status === f.status) && (f.cat === 'all' || c.cat === f.cat) && (!q || norm(c.id + c.title + c.desc).includes(q)))
      .sort((a, b) => b.updated - a.updated);
    return list.length ? caseTable(list, false) : `<div class="card">${emptyState('پرونده‌ای با این فیلترها پیدا نشد.', '<button class="btn btn-ghost btn-sm" data-action="df-clear">پاک کردن فیلترها</button>')}</div>`;
  },
  render() {
    const f = ui.desk, mine = myCases();
    return pageHead('میز خدمت و پیگیری مشکلات', 'مشکلات آب، برق، مجوزها، زیرساخت، محیط‌زیست و سایر موانع تولید را ثبت کنید و مسیر رسیدگی را مرحله‌به‌مرحله ببینید.',
      `<button class="btn btn-primary" data-action="new-case">${icon('plus')}ثبت مشکل جدید</button>`) +
      `<div class="flow card">
        <button class="flow-step ${f.status === 'all' ? 'on' : ''}" data-action="df" data-key="status" data-val="all"><b>${fa(mine.length)}</b><span>همه پرونده‌ها</span></button>
        ${STATUSES.map(s => `<button class="flow-step ${toneCls(s.tone)} ${f.status === s.key ? 'on' : ''}" data-action="df" data-key="status" data-val="${s.key}" aria-pressed="${f.status === s.key}"><b>${fa(caseCount(mine, s.key))}</b><span>${s.label}</span></button>`).join(`<span class="flow-arrow">${icon('chevLeft')}</span>`)}
      </div>
      <div class="toolbar">

        <select id="desk-cat" class="tselect" data-filter="desk.cat" aria-label="دسته">${[['all', 'همه دسته‌ها'], ...PROBLEM_CATS.concat('export').map(k => [k, CASE_CATS[k].label])].map(([k, l]) => `<option value="${k}" ${f.cat === k ? 'selected' : ''}>${l}</option>`).join('')}</select>

ACTIONS.df = el => { ui.desk[el.dataset.key] = el.dataset.val; rerender(); };
ACTIONS['df-clear'] = () => { Object.assign(ui.desk, { q: '', status: 'all', cat: 'all' }); rerender(); };
ACTIONS['new-case'] = el => openCaseForm({ cat: el.dataset.cat, title: el.dataset.title });

function openCaseForm(preset = {}) {
  const cats = PROBLEM_CATS.map(k => [k, CASE_CATS[k].label, CASE_CATS[k].icon, CASE_CATS[k].tone]);
  openPanel({
    size: 'md', key: 'case-form', title: preset.cat === 'permit' ? 'درخواست مجوز یا پیگیری مجوز' : 'ثبت مشکل جدید',
    sub: `<span>ثبت به نام ${esc(COMPANIES[ME].name)} · ${esc(COMPANIES[ME].park)}</span>`,
    body: `<form id="caseForm" class="form-grid" data-form="case" novalidate>
      ${field('cat', 'موضوع', tilePicker('cat', cats, preset.cat || ''), { group: true, cls: 'full' })}
